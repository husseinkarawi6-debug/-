      el.style.setProperty('--d',(.74+.26*front).toFixed(2));el.style.zIndex=front>0?8:6;});
    place(fTitle,px,py-(r*Math.abs(ppu))-16,.5,1);fTitle.style.opacity=Math.min(1,FOCUS.a*1.5);}
  else fTitle.style.opacity=0;}

/* ================= picking in the world ================= */
const pv=new V3();
function proj(v){pv.copy(v).project(camera);return [(pv.x*.5+.5)*W,(-pv.y*.5+.5)*H,pv.z];}
let hot=null;const mouse={x:0,y:0,tx:0,ty:0};
function pickAt(x,y){let best=null,bd=1e9;const ppu=pxPerUnit();
  Object.values(WORLDS).forEach(w=>{const [sx,sy]=proj(w.g.position);const r=w.d.r*w.scale*ppu+10;const d=Math.hypot(x-sx,y-sy);if(d<r&&d<bd){bd=d;best={t:'world',k:w.k};}});
  {const [sx,sy]=proj(portWorld());const d=Math.hypot(x-sx,y-sy);if(d<16&&d<bd){bd=d;best={t:'port'};}}
  if(!best){const [zx,zy]=proj(tmpV.set(0,zoe.position.y,0));if(Math.hypot(x-zx,y-zy)<PR*ppu*.95)best={t:'zoe'};}
  return best;}
canvas.addEventListener('pointermove',e=>{const p=pickAt(e.clientX,e.clientY);hot=p;if(!ring.hovered)canvas.style.cursor=p?'pointer':'';Object.values(WORLDS).forEach(w=>w.hover=p&&p.t==='world'&&p.k===w.k?1:0);});
canvas.addEventListener('click',e=>{const p=pickAt(e.clientX,e.clientY);if(!p){closeDrawer();chat.classList.remove('open');if(FULL)exitFocus();return;}
  if(p.t==='world')enterFocus(p.k);else if(p.t==='node')openMem(p.id);else if(p.t==='port')enterFocus('graphify');else if(p.t==='zoe'){FULL&&FOCUS&&FOCUS.k==='zoe'?exitFocus():enterFocus('zoe');}});
addEventListener('pointermove',e=>{mouse.tx=e.clientX/W-.5;mouse.ty=e.clientY/H-.5;});
document.addEventListener('click',e=>{if(!e.target.closest('#chat')&&!e.target.closest('#live'))chat.classList.remove('open');});
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(repEl.classList.contains('open'))return closeRep();if(whyEl.classList.contains('open'))return closeWhy();if(drawer.classList.contains('open'))return closeDrawer();if(!fPop.hidden)return hidePop();if(FULL)return exitFocus();if(activeWs)return exitWs();});

/* ================= camera + layout ================= */
const view={cx:0,cy:0,d:16,tcx:0,tcy:0,td:16};
const TAN=Math.tan(THREE.MathUtils.degToRad(15));
const pxPerUnit=()=>H/(2*view.d*TAN);
function layout(snap){W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);camera.aspect=W/H;
  const mob=W<900;const wide=!mob&&wsp.classList.contains('wide');const ww=wide?Math.round(Math.min(W-32-340,Math.max(560,W*.69))):370;if(!mob)wsp.style.width=ww+'px';else wsp.style.width='';const L=mob||FULL?0:(activeWs?16+ww:0),R=mob||FULL?W:(wide?W-16:W-16-340-8);const top=mob?100:64;const stackH=110;const bottom=H-18-stackH;
  view.tcx=(L+R)/2;view.tcy=top+(bottom-top)*.48;const sw=Math.max(260,R-L-(mob?20:60)),sh=Math.max(240,bottom-top);
  const needW=activeWs?2*(WORLD_R*.7+.6):2*(WORLD_R+.7),needH=4.2;
  view.td=Math.max(needW*H/(2*TAN*sw),needH*H/(2*TAN*sh),10);
  const sw2=Math.min(640,R-L-(mob?20:40));const st=$('#stack');st.style.width=sw2+'px';st.style.left=(view.tcx-sw2/2)+'px';
  layout.b={L,R,top,bottom};
  if(snap){view.cx=view.tcx;view.cy=view.tcy;view.d=view.td*1.25;}sizePost();}
addEventListener('resize',()=>layout());

/* ================= loop ================= */
const ease=t=>1-Math.pow(1-Math.min(Math.max(t,0),1),3);
let last=performance.now(),t0=0,running=true;
document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(running){last=performance.now();requestAnimationFrame(loop);}});
const zAura=new THREE.Color(),cAmber=lin('#EDA947');let zActS=0;const tmpV=new V3();
function place(el,x,y,ax=.5,ay=0){el.style.transform=`translate3d(${(x-el.offsetWidth*ax).toFixed(1)}px,${(y-el.offsetHeight*ay).toFixed(1)}px,0)`;}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;if(!t0)t0=now;introT=(now-t0)/1000;
  const form=RM?1:ease((introT-.3)/2.2);
  compM.uniforms.uExp.value=.82*ease(introT/2);compM.uniforms.uT.value=T;
  // layout follows context (smooth)
  if(activeWs!==layout._ws){layout._ws=activeWs;layout();}
  const kv=1-Math.exp(-dt*3.2),kd=1-Math.exp(-dt*2.2);view.cx+=(view.tcx-view.cx)*kv;view.cy+=(view.tcy-view.cy)*kv;view.d+=(view.td-view.d)*kd;
  mouse.x+=(mouse.tx-mouse.x)*.035;mouse.y+=(mouse.ty-mouse.y)*.035;const par=RM?0:1;
  camera.setViewOffset(W,H,-(view.cx-W/2),-(view.cy-H/2),W,H);camera.updateProjectionMatrix();
  if(camDist==null)camDist=view.d;const fk=1-Math.exp(-dt*1.5);camLook.lerp(FULL&&FOCUS?focusPos(FOCUS.k,tmpV):tmpV.set(0,0,0),fk);camDist+=((FULL&&FOCUS?focusDist(FOCUS.k):view.d)-camDist)*fk;const pm=FULL?.35:1;
  camera.position.set(camLook.x-mouse.x*1.1*par*pm,camLook.y+camDist*.17+mouse.y*.45*par*pm,camLook.z+camDist);camera.lookAt(camLook);
  // ZOE
  zoeFlash*=.95;const act=Math.min(1,({understanding:.45,reviewing:.3}[ZOE.state]||.2)+zoeFlash*.7);zActS+=(act-zActS)*.08;zAura.lerp(cAmber,.1);
  pMat.uniforms.uT.value+=dt*(RM?0:(.35+zActS*1.2));const zDim=FULL&&FOCUS&&FOCUS.k!=='zoe'?(FOCUS.k==='graphify'?.45:.2):1;pMat.uniforms.uI.value=form*.85*zDim;pMat.uniforms.uAura.value.copy(zAura);pMat.uniforms.uAct.value=zActS;
  atmM.uniforms.uAura.value.copy(zAura);atmM.uniforms.uAct.value=zActS;atmM.uniforms.uI.value=form*zDim;
  pMesh.rotation.y+=dt*(RM?0:.03);cloudMesh.rotation.y+=dt*(RM?0:.042);cloudM.uniforms.uT.value=T;cloudM.uniforms.uI.value=form*zDim;zHalo.material.opacity=.14*form*zDim;
  zoe.position.y=RM?0:Math.sin(T*.5)*.03;
  // memory rings
  const rForm=RM?1:ease((introT-1)/2.4);portT.value=T;ring.setIntensity(rForm*(FULL&&FOCUS?(FOCUS.k==='graphify'?.9:FOCUS.k==='zoe'?.7:.1):1));ring.tick(dt);
  gPulse*=.955;const gk=Math.min(1.4,gPulse);pShell.material.uniforms.uI.value=(.5+gk*1.7)*rForm*(FULL&&FOCUS&&FOCUS.k!=='graphify'?.2:1);pCore.material.opacity=(.7+gk*.3)*rForm;pCore.scale.setScalar(.18+gk*.14);pHalo.material.opacity=(.18+gk*.5)*rForm;pHalo.scale.setScalar(.7+gk*.6);pRing.rotation.z+=dt*(.2+gk);pRing.material.opacity=(.3+gk*.4)*rForm;
  // work worlds

    const intro=RM?1:ease((introT-1.4-i*.2)/1.2);w.mat.uniforms.uI.value=intro*(w.dim?(FULL?.14:.45):1);w.mat.uniforms.uT.value=T;w.mat.uniforms.uAct.value=Math.min(1,w.hover*.6+w.act+(activeWs===w.k?.35:0));w.mesh.rotation.y+=dt*.12;
    w.halo.material.opacity=intro*(.12+w.hover*.25+w.act*.4+(activeWs===w.k?.2:0))*(w.dim?(FULL?.08:.4):1);
    w.moonList.forEach(s=>{s.userData.a+=dt*s.userData.sp*(RM?0:1);s.position.set(Math.cos(s.userData.a)*s.userData.r,Math.sin(s.userData.a)*s.userData.r,Math.sin(s.userData.a*2)*.04);s.material.opacity=1;s.visible=intro>.2;});
    if(w.extra)w.extra.rotation.z+=dt*.15;
    if(w.signal){const k=((T*.25)%1);w.signal.scale.setScalar(1+k*1.6);w.signal.material.opacity=(1-k)*.4*intro*(w.dim?.3:1);}});
  // agents (quiet unless working)
  AGENTS.forEach((a,i)=>{const th=a.base+T*(RM?0:.05);a.g.position.set(Math.cos(th)*a.r,Math.sin(th)*a.r,0);a.flash*=.955;
    const tI=(a.state==='working'?.8:a.state==='completed'?1:.12)+a.flash*.6;a.I+=(tI-a.I)*.06;const intro=RM?1:ease((introT-1.8-i*.1)/1);
    a.core.material.opacity=(.35+a.I*.65)*intro;a.core.scale.setScalar(.07+a.I*.06);a.halo.material.opacity=a.I*.45*intro;a.halo.scale.setScalar(.25+a.I*.35+(a.state==='working'?Math.sin(T*3+i)*.04:0));});

  Object.entries(WLBL).forEach(([k,el])=>{const w=WORLDS[k];const [x,y]=proj(tmpV.copy(w.g.position).add(new V3(0,-w.d.r*w.scale-.08,0)));place(el,x,y+6);el.style.opacity=(RM?1:ease((introT-1.6)/1.2))*(w.dim?.4:1)*(FOCUS?0:1);el.classList.toggle('act',activeWs===k);el.classList.toggle('hov',!!w.hover);});
  AGENTS.forEach(a=>{const el=ALBL[a.id];const on=a.state==='working'||a.state==='completed';el.classList.toggle('on',on);if(on){el.querySelector('span').textContent=a.state==='completed'?'أنجز':a.task;const [x,y]=proj(a.g.getWorldPosition(tmpV));place(el,x,y-12,.5,1);}});
  if(swapAt&&ring.has(swapAt)){const [x,y]=proj(nodeWorld(swapAt,tmpV));place(swapEl,x,y-16,.5,1);}

  focusFrame(dt);for(let i=FX.length-1;i>=0;i--)if(FX[i](now))FX.splice(i,1);updateBeams(now);
  sky.material.uniforms.uT.value=T;scene.traverse(o=>{if(o.isPoints&&o.material.uniforms&&o.material.uniforms.uT&&!o.userData.nmr)o.material.uniforms.uT.value=T;});
  renderFrame();requestAnimationFrame(loop);}

/* ================= boot ================= */
renderRail();renderSugg();renderMtabs();setCtxChip();
setAgent('analyst','working','إعادة حساب مجموع أيلول');setAgent('dev','working','إصلاح مزامنة الإشعارات');
setInterval(()=>{NOW++;$('#clock').textContent=tm(NOW);},RM?5000:4000);
layout(true);
requestAnimationFrame(t=>{last=t;document.body.classList.add('ready');requestAnimationFrame(loop);});
})();
