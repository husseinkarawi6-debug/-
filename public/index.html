<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نيبتون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Neptune — design tokens
   ZOE is the centre. Her rings are the memory (Graphify). Three work worlds orbit her.
   3D = memory, relations, motion, context change.  2D = lists, numbers, actions. */
:root{
  --void:#03060C;--ink:#E8E4DA;--soft:#B4B9C5;--muted:#848D9F;--faint:#586276;
  --amber:#D99A45;--mem:#6FC2DA;--ok:#6CC499;--bad:#DE6A5B;--wait:#AE9FE6;
  --pur:#7FB8E0;--debt:#E08A5F;--mkt:#A9C46C;
  --line:rgba(176,198,255,.075);--line2:rgba(176,198,255,.14);
  --glass:rgba(6,10,20,.74);--glass2:rgba(9,14,26,.94);
  --fd:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --fb:"IBM Plex Sans Arabic","Alexandria",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.2,1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --void:#03060C; } }
:root[data-theme="dark"]{ --void:#03060C; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--void);color:var(--ink);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:1.5px solid var(--amber);outline-offset:3px;border-radius:8px}
svg.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.6s var(--ease)}
body.ready #stage{opacity:1}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;inset-inline:0;height:60px;display:flex;align-items:center;gap:28px;padding:0 24px;z-index:30;background:linear-gradient(to bottom,rgba(3,6,12,.92),rgba(3,6,12,0))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:500;font-size:12px;letter-spacing:.34em;color:var(--soft)}
.brand svg{width:26px;height:26px}
.nav{display:flex;gap:2px}
.nav a{font-size:13.5px;color:var(--muted);text-decoration:none;padding:7px 11px;border-radius:9px;position:relative;transition:color .25s}
.nav a:hover,.nav a[aria-current]{color:var(--ink)}
.nav a[aria-current]::after{content:"";position:absolute;inset-inline:11px;bottom:1px;height:1.5px;border-radius:2px;background:var(--amber)}
.top-end{margin-inline-start:auto;display:flex;align-items:center;gap:12px}
.health{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;color:var(--soft)}
.health i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.clock{font-size:13px;color:var(--faint)}
.search{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);color:var(--faint);font-size:13px;min-width:190px}
.search kbd{margin-inline-start:auto;font-family:var(--fb);font-size:11px;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--muted)}

/* ---------- right rail: the day ---------- */
.rail{position:fixed;top:68px;bottom:16px;right:16px;width:340px;z-index:10;border-radius:20px;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 40px 80px -40px rgba(0,0,0,.85);overflow-y:auto;scrollbar-width:none;padding:20px 18px 18px;
  opacity:0;transform:translateX(16px);transition:opacity 1s var(--ease) .2s,transform 1s var(--ease) .2s}
.rail::-webkit-scrollbar{display:none}
body.ready .rail{opacity:1;transform:none}
.hello h1{margin:0;font-family:var(--fd);font-weight:400;font-size:21px;letter-spacing:-.005em}
.hello .date{font-size:12px;color:var(--faint);margin-top:3px}
.rs{margin-top:22px}
.rs-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.rs-h h2{margin:0;font-family:var(--fd);font-weight:500;font-size:13.5px;color:var(--soft)}
.rs-h .n{font-size:11.5px;color:var(--amber)}
.rs-h .more{margin-inline-start:auto;font-size:12px;color:var(--muted);transition:color .2s}
.rs-h .more:hover{color:var(--amber)}
.brief{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin-top:14px;border-radius:14px;overflow:hidden;background:var(--line)}
.bf{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;background:rgba(6,10,20,.9);text-align:start;transition:background .25s}
.bf:hover{background:rgba(14,20,34,.95)}
.bf b{font-family:var(--fd);font-weight:400;font-size:22px;line-height:1.1;color:var(--ink)}
.bf span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bf span i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.row{position:relative;padding:10px 12px 10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row::before{content:"";position:absolute;right:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--c,var(--amber))}
.row .t{display:flex;gap:10px;align-items:baseline;font-size:13.5px;line-height:1.5;padding-inline-start:12px}
.row .t span:first-child{flex:1;min-width:0}
.row .amt{font-family:var(--fd);font-size:13px;white-space:nowrap}
.row .m{font-size:11.5px;color:var(--muted);margin-top:2px;padding-inline-start:12px}
.row .m .bad{color:var(--bad)}
.row .acts{display:flex;gap:6px;margin-top:8px;padding-inline-start:12px}
.row.gone{opacity:0;transform:translateX(14px);transition:.4s var(--ease)}
.btn{height:28px;padding:0 11px;border-radius:8px;font-size:12px;border:1px solid var(--line2);color:var(--ink);transition:transform .15s,background .25s,border-color .25s;white-space:nowrap}
.btn:hover{border-color:rgba(217,154,69,.5)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#170f04;font-weight:500}
.btn.pri:hover{background:#E6AA58}
.tl{position:relative}
.ev{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:baseline;padding:6px 0;font-size:12.5px}
.ev time{font-family:var(--fd);font-size:12px;color:var(--muted)}
.ev.next time{color:var(--amber)}
.ev .x{color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.next .x{color:var(--ink)}
.tag{font-size:10.5px;padding:1px 7px;border-radius:6px;white-space:nowrap;color:var(--muted);background:rgba(255,255,255,.04)}
.tag.np{color:var(--mem);background:rgba(111,194,218,.1)}
.now{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--amber);margin:2px 0}
.now::after{content:"";flex:1;height:1px;background:linear-gradient(to left,rgba(217,154,69,.45),transparent)}
.feed .a{display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:12px;color:var(--muted);padding:3px 0}
.feed .a time{color:var(--faint);font-size:11.5px}
.feed .a b{font-weight:500;color:var(--soft)}
.feed .a.new{animation:rowIn .8s var(--ease) both}
@keyframes rowIn{from{opacity:0;transform:translateY(-4px);background:rgba(217,154,69,.08)}}
.quiet{font-size:12.5px;color:var(--faint);padding:6px 0}

/* ---------- workspace panel (left, only inside a work world) ---------- */
.wsp{position:fixed;top:68px;bottom:16px;left:16px;width:370px;z-index:11;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 40px 80px -40px rgba(0,0,0,.85);overflow-y:auto;scrollbar-width:none;padding:20px 18px 20px;transform:translateX(calc(-100% - 30px));transition:transform .7s var(--ease)}
.wsp::-webkit-scrollbar{display:none}
.wsp.open{transform:none}
.wsh{display:flex;gap:12px;align-items:flex-start}
.orbI{width:40px;height:40px;border-radius:50%;flex:none;background:radial-gradient(circle at 36% 30%,#fff 0,color-mix(in srgb,var(--c) 85%,#fff) 12%,var(--c) 38%,color-mix(in srgb,var(--c) 30%,#03060c) 78%);box-shadow:0 0 24px -4px var(--c),inset -6px -8px 14px rgba(0,0,0,.5)}
.wsh h2{margin:0;font-family:var(--fd);font-weight:500;font-size:20px}
.wsh p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.wsh .x{margin-inline-start:auto}
.iconb{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--muted);transition:background .2s,color .2s;flex:none}
.iconb:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.iconb svg{width:16px;height:16px}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
.qa button{height:30px;padding:0 11px;border-radius:9px;border:1px solid var(--line2);font-size:12.5px;color:var(--soft);transition:border-color .2s,color .2s}
.qa button:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent);color:var(--ink)}
.qa button.p{border-color:color-mix(in srgb,var(--c) 55%,transparent);color:var(--c)}
.wsec{margin-top:18px}
.wsec h3{display:flex;align-items:baseline;gap:8px;margin:0 0 4px;font-family:var(--fd);font-weight:500;font-size:13px;color:var(--soft)}
.wsec h3 .n{font-size:11.5px;color:var(--c)}
.wr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;width:100%;text-align:start;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.wsec h3+.wr,.wsec h3+div>.wr:first-child{border-top:0}
button.wr{transition:color .2s}button.wr:hover{color:#fff}
.wr small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.55}
.wr .v{font-family:var(--fd);font-size:13px;white-space:nowrap;text-align:left}
.dl{font-size:11px;font-family:var(--fb);padding:1px 7px;border-radius:6px;white-space:nowrap}
.dl.up{color:var(--bad);background:rgba(222,106,91,.1)}.dl.down{color:var(--ok);background:rgba(108,196,153,.1)}.dl.new{color:var(--mem);background:rgba(111,194,218,.1)}.dl.miss{color:var(--wait);background:rgba(174,159,230,.1)}.dl.same{color:var(--muted);background:rgba(255,255,255,.04)}
.seg{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;margin:12px 0 4px}
.seg button{flex:none;height:28px;padding:0 10px;border-radius:8px;font-size:12px;color:var(--muted);border:1px solid transparent}
.seg button[aria-pressed=true]{color:var(--ink);border-color:var(--line2);background:rgba(255,255,255,.04)}
.stat{display:flex;gap:18px;margin-top:14px}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--fd);font-weight:400;font-size:20px}
.stat span{font-size:11.5px;color:var(--muted)}
.demo{font-size:11px;color:var(--wait);margin-top:6px}

/* ---------- labels living in the 3D world ---------- */
.lbl{position:fixed;left:0;top:0;z-index:6;will-change:transform;white-space:nowrap;text-shadow:0 1px 10px #000,0 0 2px #000;transition:opacity .5s}
.zoe-tag{display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.zoe-tag b{font-family:var(--fd);font-weight:500;font-size:16px}
.zoe-tag span{font-size:12px;color:var(--muted)}
.wl{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 10px;border-radius:12px;transition:background .25s}
.wl:hover,.wl.hov{background:rgba(255,255,255,.035)}
.wl b{font-family:var(--fd);font-weight:500;font-size:14px;color:var(--ink)}
.wl span{font-size:11.5px;color:var(--muted)}
.wl span em{font-style:normal;color:var(--c)}
.wl.dim{opacity:.35}
.wl.act b::after{content:"";display:block;height:1.5px;margin-top:3px;border-radius:2px;background:var(--c)}
.gport{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 8px;border-radius:10px}
.gport:hover{background:rgba(255,255,255,.035)}
.gport b{font-family:var(--fd);font-weight:500;font-size:11.5px;letter-spacing:.03em;color:var(--mem)}
.gport span{display:flex;gap:8px;font-size:10.5px;color:var(--muted)}
.gport span i{font-style:normal;color:var(--soft)}
.gport.bump span i{animation:bump .9s var(--ease)}
@keyframes bump{30%{color:var(--mem)}}
.al{font-size:11px;display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;background:rgba(4,8,16,.72);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);pointer-events:none;opacity:0}
.al b{font-family:var(--fd);font-weight:500;color:var(--c)}
.al span{color:var(--soft);max-width:170px;overflow:hidden;text-overflow:ellipsis}
.al.on{opacity:1}
.sl{font-size:10.5px;color:var(--c);opacity:0;pointer-events:none}
.sl.on{opacity:.85}
.tip{position:fixed;z-index:35;left:0;top:0;pointer-events:none;padding:8px 11px;border-radius:11px;background:var(--glass2);border:1px solid var(--line2);font-size:12px;line-height:1.5;opacity:0;transition:opacity .2s;max-width:240px}
.tip b{display:block;font-weight:500;font-size:12.5px;color:var(--ink)}
.tip span{color:var(--muted)}
.tip.on{opacity:1}
.swap{display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;opacity:0}
.swap.show{opacity:1}
.swap .r2{display:flex;align-items:center;gap:6px;font-size:13px}
.swap b{font-family:var(--fd);font-weight:500;transition:color .5s}
.swap .tg{font-size:10.5px;padding:0 7px;border-radius:6px;line-height:18px;color:var(--mem);background:rgba(111,194,218,.14);transition:.5s}
.swap.rep .o b{color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.swap.rep .o .tg{color:var(--muted);background:rgba(255,255,255,.05)}
.swap .md,.swap .nw{opacity:0;transform:translateY(-4px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.swap .md{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--muted);line-height:1.3}
.swap .md svg{width:10px;height:12px}
.swap.rep .md{opacity:1;transform:none;transition-delay:.35s}
.swap.rep .nw{opacity:1;transform:none;transition-delay:.85s}

/* ---------- conversation stack: live memory strip + thread + composer ---------- */
.stack{position:fixed;bottom:18px;z-index:12;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(14px);transition:opacity 1s var(--ease) .5s,transform 1s var(--ease) .5s,left .7s var(--ease),width .7s var(--ease)}
body.ready .stack{opacity:1;transform:none}
.live{display:flex;align-items:center;gap:10px;min-height:30px;padding:0 4px;opacity:0;transition:opacity .5s var(--ease);pointer-events:none}
.live.on{opacity:1}
.live .h{font-size:11.5px;color:var(--faint);white-space:nowrap}
.steps{display:flex;align-items:center;gap:0;flex:1;min-width:0;overflow:hidden;justify-content:flex-start}
.st{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);white-space:nowrap;animation:stIn .5s var(--ease) both;flex:none}
.st i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c);flex:none}
.st.past{color:var(--muted)}.st.past i{box-shadow:none;opacity:.5}
.st:not(.past) i{animation:orb 1.2s ease-in-out infinite}
.st+.st::before{content:"";width:18px;height:1px;margin:0 9px;background:linear-gradient(to left,var(--c),transparent);opacity:.6;flex:none}
.st b{font-family:var(--fd);font-weight:500}
@keyframes stIn{from{opacity:0;transform:translateX(-8px)}}
@keyframes orb{50%{transform:scale(1.35)}}
.fin{display:none;align-items:center;gap:8px 10px;font-size:13px;flex-wrap:wrap}
.live.done .h,.live.done .steps{display:none}
.live.done .fin{display:flex}
.fin i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c)}
.fin b{font-family:var(--fd);font-weight:500}
.lk{pointer-events:auto;font-size:12px;color:var(--mem)}
.lk:hover{text-decoration:underline}
.chat{border-radius:18px;border:1px solid var(--line2);background:rgba(5,9,18,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.9);transition:border-color .3s,box-shadow .3s}
.chat:focus-within{border-color:rgba(217,154,69,.4);box-shadow:0 0 0 3px rgba(217,154,69,.06),0 30px 60px -30px rgba(0,0,0,.9)}
.thread{max-height:0;overflow-y:auto;transition:max-height .6s var(--ease);scrollbar-width:thin;scrollbar-color:rgba(176,198,255,.12) transparent}
.chat.open .thread{max-height:var(--thr,260px)}
.thread-in{padding:14px 16px 4px}
.th-h{display:none;align-items:center;gap:10px;padding:10px 16px 0;font-size:12.5px;color:var(--muted)}
.chat.open .th-h{display:flex}
.th-h b{font-family:var(--fd);font-weight:500;color:var(--ink)}
.th-h button{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.peek{display:flex;align-items:center;gap:10px;padding:9px 16px 0;font-size:12.5px;color:var(--soft);cursor:pointer}
.chat.open .peek{display:none}
.peek .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek .tx b{font-weight:500;color:var(--amber)}
.sugg{display:none;gap:6px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:none}
.chat.open .sugg{display:flex}
.sugg button{flex:none;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--soft)}
.sugg button:hover{border-color:rgba(217,154,69,.4);color:var(--ink)}
.cmd{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 10px}
.cmd textarea{flex:1;resize:none;outline:0;color:var(--ink);font:14.5px/1.6 var(--fb);padding:6px;max-height:120px}
.cmd textarea::placeholder{color:var(--faint)}
.ctx{display:none;align-items:center;gap:6px;height:30px;margin-bottom:3px;padding:0 10px;border-radius:9px;font-size:12px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink);flex:none;white-space:nowrap}
.ctx.on{display:flex}
.ctx i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.ctx svg{width:11px;height:11px;color:var(--muted)}
.send{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;color:var(--muted);transition:background .2s,color .2s}
.send.on{background:var(--amber);color:#170f04}
.send svg{width:17px;height:17px}
.msg{display:grid;grid-template-columns:26px 1fr;gap:10px;margin-bottom:13px;animation:rowIn .5s var(--ease) both}
.msg .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-size:11px;color:var(--c);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 16%,#0A1020),#070B15)}
.msg-h{display:flex;gap:8px;align-items:baseline;font-size:12px;margin-bottom:2px}
.msg-h b{font-family:var(--fd);font-weight:500;font-size:13px;color:var(--c)}
.msg-h time{margin-inline-start:auto;color:var(--faint);font-size:11px}
.msg p{margin:0;font-size:14px;line-height:1.75}
.msg.me{grid-template-columns:1fr;margin-inline-start:40px;padding:8px 12px;border-radius:12px;background:rgba(217,154,69,.05);border:1px solid rgba(217,154,69,.12)}
.msg.me .msg-h b{color:var(--amber)}
.msg.me.hl{animation:msgHl 2.6s var(--ease)}
@keyframes msgHl{15%,60%{box-shadow:0 0 0 1px rgba(217,154,69,.55),0 0 28px -6px rgba(217,154,69,.6)}}
.card{margin-top:7px;padding:8px 10px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.02);font-size:13px}
.card .r{display:flex;gap:10px;padding:3px 0;color:var(--soft)}
.card .r span:last-child{margin-inline-start:auto;color:var(--muted);white-space:nowrap}
.card h5{margin:6px 0 2px;font-size:11.5px;font-weight:500;color:var(--faint)}
.card h5:first-child{margin-top:0}
.msg .btns{display:flex;gap:6px;margin-top:8px}

/* ---------- drawer + overlay ---------- */
.drawer{position:fixed;top:68px;bottom:16px;left:16px;z-index:25;width:370px;border-radius:20px;border:1px solid var(--line2);background:#080C17;box-shadow:0 40px 90px -30px rgba(0,0,0,.95);overflow-y:auto;scrollbar-width:none;padding:20px;transform:translateX(calc(-100% - 30px));transition:transform .55s var(--ease)}
.drawer.open{transform:none}
.dr-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.dr-top .iconb{margin-inline-start:auto}
.dr-kind{display:flex;align-items:center;gap:6px}
.dr-title{margin:12px 0 2px;font-family:var(--fd);font-weight:500;font-size:19px;line-height:1.4}
.dr-big{font-family:var(--fd);font-size:28px;font-weight:400;margin-top:6px}
.dr-big small{font-size:13px;color:var(--muted);margin-inline-start:4px}
.dr-sub{font-size:13px;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;font-size:11.5px;border:1px solid var(--line2);color:var(--soft)}
.chip.m{border-color:rgba(111,194,218,.3);color:var(--mem)}
.chip.w{border-color:rgba(174,159,230,.3);color:var(--wait)}
.chip.o{color:var(--muted)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:18px 0 0;font-size:13px}
dl.kv dt{color:var(--faint)}
dl.kv dd{margin:0;color:var(--soft)}
.drawer h4{margin:22px 0 8px;font-family:var(--fd);font-weight:500;font-size:13px;color:var(--soft)}
.hist{border-inline-start:1px solid var(--line2);padding-inline-start:12px;margin-inline-start:3px}
.hist div{position:relative;font-size:12.5px;color:var(--muted);padding:4px 0}
.hist div::before{content:"";position:absolute;right:-16px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--faint)}
.hist time{color:var(--faint);margin-inline-end:8px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links span{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:9px;border:1px solid var(--line2);font-size:12px;color:var(--soft)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt td{padding:7px 0;border-top:1px solid var(--line);color:var(--soft)}
table.dt td:nth-child(2){text-align:left;font-family:var(--fd)}
table.dt td:last-child{text-align:left;width:1%;padding-inline-start:10px}
.lst{width:100%;margin-top:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(2,5,11,.5);color:var(--ink);font:13px/1.8 var(--fb);resize:vertical;outline:0;direction:ltr;text-align:left}
.lst:focus{border-color:rgba(217,154,69,.45)}
.ov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(2,4,9,.36);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.ov.open{opacity:1;pointer-events:auto}
.ovb{width:min(540px,92vw);max-height:86vh;overflow:auto;border-radius:20px;background:#0A0F1C;border:1px solid var(--line2);box-shadow:0 60px 120px -30px rgba(0,0,0,.95);transform:translateY(18px) scale(.985);transition:transform .5s var(--ease);scrollbar-width:thin}
.ov.open .ovb{transform:none}
.why-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 6px}
.why-h h3{margin:2px 0 4px;font-family:var(--fd);font-weight:500;font-size:18px}
.why-h p{margin:0;font-size:12.5px;color:var(--muted)}
.why-h .iconb{margin-inline-start:auto}
.wpath{padding:12px 22px 4px}
.wst{display:grid;grid-template-columns:30px 1fr;gap:12px;padding-bottom:16px;position:relative;opacity:.12;transform:translateY(4px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.wst.on{opacity:1;transform:none}
.wst::after{content:"";position:absolute;right:14.5px;top:34px;bottom:2px;width:1px;background:linear-gradient(var(--c),rgba(176,198,255,.08));transform-origin:top;transform:scaleY(0);transition:transform .5s var(--ease) .15s}
.wst.on::after{transform:scaleY(1)}
.wst:last-child::after{display:none}
.wst .gl{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--c);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 16%,#0A1020),#070B15)}
.wst .gl svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wst b{display:block;font-family:var(--fd);font-weight:500;font-size:14px;margin-top:4px}
.wst span{font-size:13px;color:var(--soft);line-height:1.7}
.wsrc{padding:0 22px 22px;animation:rowIn .6s var(--ease) both}
.key{padding:12px 14px;border-radius:12px;background:rgba(217,154,69,.07);border:1px solid rgba(217,154,69,.2);font-size:14.5px;line-height:1.75;margin-bottom:8px}
.wsrc .meta{font-size:12px;color:var(--muted);margin-bottom:12px}
.toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-10px);z-index:50;padding:9px 14px;border-radius:11px;background:rgba(10,15,28,.96);border:1px solid rgba(217,154,69,.35);font-size:13px;opacity:0;pointer-events:none;transition:.4s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.proto{position:fixed;bottom:3px;left:16px;font-size:10.5px;color:var(--faint);z-index:5;opacity:.7}
.mtabs{display:none}

/* ---- universal ZOE + Business Pulse: extensions of the existing components ---- */
.ctx.gen{display:flex;opacity:.8;border-color:var(--line2)}
.attb{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);margin-bottom:1px;flex:none}
.attb:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.attb svg{width:17px;height:17px}
.attm{position:absolute;bottom:62px;inset-inline-start:0;z-index:5;border-radius:12px;border:1px solid var(--line2);background:#0A0F1C;padding:6px;box-shadow:0 30px 60px -20px #000;min-width:230px}
.attm button{display:flex;gap:8px;width:100%;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--soft);text-align:start}
.attm button:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.attm small{display:block;padding:4px 10px;font-size:11px;color:var(--faint)}
.attc{display:inline-flex;align-items:center;gap:6px;height:30px;margin-bottom:3px;padding:0 9px;border-radius:9px;font-size:12px;border:1px solid var(--line2);color:var(--soft);flex:none;white-space:nowrap}
.attc button{color:var(--muted)}
.attl{margin-top:4px;font-size:12px;color:var(--muted)}
.num{font-feature-settings:"tnum" 1}
.rail.away{transform:translateX(calc(100% + 30px))!important;opacity:0!important;pointer-events:none}
.wsp.wide{padding:22px 24px;transition:transform .7s var(--ease),width .6s var(--ease)}
.bpnet{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.bpnet>span:first-child{font-size:12px;color:var(--muted);width:100%}
.bpnet b{font-family:var(--fd);font-weight:400;font-size:28px;line-height:1.1}
.bpnet.big{padding:14px 16px;border-radius:14px;border:1px solid rgba(111,194,218,.25);background:linear-gradient(160deg,rgba(111,194,218,.09),rgba(6,10,20,.4) 65%);margin:0}
.bpnet.big b{font-size:38px}
.bpnet details{width:100%}
.bpnet summary{list-style:none;cursor:pointer;margin-top:4px}
.bpnet summary::-webkit-details-marker{display:none}
.brief.bp6 .bf b{font-size:16px}
.rail .brief.bp6 .bf:last-child{grid-column:1/-1}
.brief.bp6 .bf span{flex-wrap:wrap}
.wsp .brief.bp6{grid-template-columns:repeat(5,minmax(0,1fr));margin-top:0}
.wsp .brief.bp6 .bf{padding:12px}
.wsp .brief.bp6 .bf b{font-size:19px}
.lnk{font-size:12px;color:var(--mem)}
.lnk:hover{text-decoration:underline}
.bpsum{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,2.15fr);gap:14px;align-items:stretch;margin-top:14px}
.bpbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.bpbar .seg{margin:0}
.bpend{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.bpq{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line2);color:var(--muted);min-width:170px}
.bpq svg{width:14px;height:14px;flex:none}
.bpq input{outline:0;flex:1;min-width:0;font-size:12.5px;color:var(--ink)}
.bpsel{height:30px;padding:0 8px;border-radius:9px;border:1px solid var(--line2);font-size:12px;color:var(--soft);background:rgba(5,9,18,.6)}
.bpsel option{background:#0A0F1C}
.bpban{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.6}
.bpban span{flex:1}.bpban b{font-weight:500}
.bpban.amber{background:rgba(217,154,69,.08);border:1px solid rgba(217,154,69,.35)}
.bpban.bad{background:rgba(222,106,91,.07);border:1px solid rgba(222,106,91,.35)}
.bpf{font-size:12px;color:var(--soft);line-height:1.9;margin-top:6px}
.bpf em{font-style:normal;color:var(--faint);margin:0 3px}
.bpnote{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.6}
.bpgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.bpl{margin:0 0 6px;padding:0;list-style:none}
.bpl li{position:relative;padding:3px 12px 3px 0;font-size:13px;color:var(--soft);line-height:1.7}
.bpl li::before{content:"";position:absolute;right:0;top:.9em;width:5px;height:5px;border-radius:50%;background:var(--mem)}
.bpopps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bpopp{padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.015);display:flex;flex-direction:column;gap:6px}
.bpopp b{font-weight:500;font-size:13px;line-height:1.5}
.bpopp p{margin:0;font-size:12px;color:var(--muted);line-height:1.6;flex:1}
.bpopp .acts{display:flex;gap:5px;flex-wrap:wrap}
.agl{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--faint)}
.agd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c,var(--faint));margin-inline-end:5px}
.lgd{display:inline-block;width:12px;height:2px;border-radius:2px;background:var(--c);margin-inline-end:5px;vertical-align:middle}
.bpchart{width:100%;height:220px;display:block}
table.bpt{width:100%;border-collapse:collapse;font-size:12.5px}
table.bpt th{font-size:11px;color:var(--faint);font-weight:400;text-align:start;padding:6px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.bpt td{padding:7px 6px;text-align:start!important;width:auto!important;font-family:var(--fb)!important;vertical-align:middle}
table.bpt td small{display:block;font-size:11px;color:var(--faint)}
table.bpt td b{font-weight:500}
table.bpt tr[data-bpp2]{cursor:pointer}
table.bpt tr[data-bpp2]:hover td{background:rgba(255,255,255,.02)}
td.found{color:var(--mem)}
.bpbars>div{display:grid;grid-template-columns:84px 1fr 72px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px}
.bpbars .tr{position:relative;display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.04)}
.bpbars .fl{position:absolute;inset-block:0;right:0;border-radius:4px;background:var(--c)}
.bpbars .av{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6;border-radius:1px}
.bpbars>div>span:last-child{text-align:left;font-family:var(--fd)}
.tag.ok{color:var(--ok);background:rgba(108,196,153,.1)}.tag.amber{color:var(--amber);background:rgba(217,154,69,.1)}.tag.bad{color:var(--bad);background:rgba(222,106,91,.1)}.tag.mem{color:var(--mem);background:rgba(111,194,218,.1)}
.bpempty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:60px 20px}
.bpempty b{font-family:var(--fd);font-weight:500;font-size:18px}
.bpempty span{color:var(--muted);font-size:13px;margin-bottom:6px}
.sk{border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.07),rgba(255,255,255,.03));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.bpsrc{padding:12px;border-radius:12px;border:1px dashed var(--line2);font-size:12.5px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bppdf{width:100%;border-radius:8px;background:#eef1f5;color:#1a2230;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;direction:ltr;text-align:left}
.bppdf mark{background:#ffe08a}
.rsteps{display:flex;gap:6px;margin-bottom:16px}
.rsteps span{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--faint)}
.rsteps i{height:3px;border-radius:2px;background:rgba(255,255,255,.07)}
.rsteps .done i{background:var(--ok)}.rsteps .on i{background:var(--amber)}.rsteps .on{color:var(--ink)}.rsteps .done{color:var(--soft)}
.bpdrop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px;border-radius:14px;border:1.5px dashed var(--line2);color:var(--muted);text-align:center;font-size:12.5px}
.bpdrop b{color:var(--ink);font-weight:500;font-size:14px}
.rvr{display:grid;grid-template-columns:1fr 130px 100px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.rvr small{display:block;font-size:11px;color:var(--faint)}
.rvr input{height:30px;border-radius:8px;border:1px solid rgba(217,154,69,.5);padding:0 8px;direction:ltr;text-align:left;font-family:var(--fd);background:rgba(217,154,69,.05);color:var(--ink)}
.rvr .ltr{text-align:left;font-family:var(--fd)}
.bpcreative{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 20% 20%,#1c3f66 0,#0b1a30 45%,#060c18 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:20px;margin-top:14px}
.bpcreative .u{position:absolute;top:22px;left:22px;width:36%;aspect-ratio:.8;border-radius:10px;background:linear-gradient(180deg,#f3f6fa,#c9d3df)}
.bpcreative .p{position:absolute;top:24px;right:22px;font-family:var(--fd);font-weight:600;font-size:26px;color:#ffd08a}
.bpcreative b{font-family:var(--fd);font-weight:600;font-size:22px;line-height:1.3}
.bpcreative span{font-size:12.5px;color:#bcd3ea;margin-top:4px}
.pctx{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted);padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid var(--line);margin-bottom:8px}
.pctx b{font-weight:500;color:var(--soft)}
.bpstat{flex-wrap:wrap}
@media (max-width:1320px){.bpopps{grid-template-columns:repeat(2,minmax(0,1fr))}.bpgrid,.bpsum{grid-template-columns:1fr}.wsp .brief.bp6{grid-template-columns:repeat(3,minmax(0,1fr))}table.bpt .opt{display:none}}
@media (max-width:900px){.bpopps{grid-template-columns:1fr}.wsp .brief.bp6{grid-template-columns:repeat(2,minmax(0,1fr))}.bpq{min-width:0;flex:1}.bpend{margin-inline-start:0}.rvr{grid-template-columns:1fr 110px}.rvr .tag{display:none}}

/* ---- Business Pulse refinement: data first, calm universe ---- */
.wsp.wide{--faint:#7E889D;--muted:#A3ABBB;--soft:#C9CED8}
.wsp.wide .wsh .x{margin-inline-start:0}
.bphd{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.bpmore{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid var(--line)}
.bplab{font-size:11.5px;color:var(--muted)}
.bpban{border:1px solid var(--line2)}
.bpx{margin-top:14px;padding:16px;border-radius:16px;border:1px solid rgba(111,194,218,.22);background:linear-gradient(160deg,rgba(111,194,218,.07),rgba(6,10,20,.35) 60%)}
.bpx .bpnet{margin:0 0 12px}
.bpx .bpnet b{font-size:42px}
.bpcmp{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.bpvs{font-style:normal;font-size:11.5px;color:var(--muted)}
.bpx3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bpk{display:flex;flex-direction:column;gap:3px;text-align:start;padding:11px 12px;border-radius:12px;background:rgba(6,10,20,.55);border:1px solid var(--line);transition:border-color .2s}
button.bpk:hover{border-color:var(--line2)}
.bpk>span:first-child{font-size:12px;color:var(--muted)}
.bpk b{font-family:var(--fd);font-weight:400;font-size:22px;line-height:1.25}
.bptop{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bptop h3{margin:0 0 8px;font-family:var(--fd);font-weight:500;font-size:13px;color:var(--soft)}
.bpt3{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:10px}
.bpti{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;border-inline-start:2px solid var(--c);background:rgba(255,255,255,.02)}
.bpti.bad{--c:var(--bad)}.bpti.ok{--c:var(--ok)}.bpti.act{--c:var(--amber);background:rgba(217,154,69,.06)}
.bpti em{font-style:normal;font-size:11px;color:var(--c)}
.bpti b{font-weight:500;font-size:13.5px;line-height:1.55}
.bpti .btn{align-self:flex-start;margin-top:4px}
.bpbrief{margin-top:16px}
.bpal .acts{align-items:center}
.bpal .bpsev{margin-inline-start:auto;font-size:10.5px;color:var(--c)}
.bpal.info .t span:first-child{color:var(--soft)}
.bpal.high .t span:first-child{color:#F0B3AA}
.wsp.wide .bpopps{grid-template-columns:1fr}
.bpopp{--c:var(--ok);border-color:color-mix(in srgb,var(--c) 26%,transparent);background:color-mix(in srgb,var(--c) 5%,transparent)}
.bpopp.mem{--c:var(--mem)}.bpopp.wait{--c:var(--wait)}
.bpopp b{color:var(--ink)}
.bpopp ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--soft)}
.bpopp ul li::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--c);margin-inline-end:6px;vertical-align:middle}
.bplg{margin-inline-start:auto;display:flex;gap:2px;flex-wrap:wrap}
.bplg button{font-family:var(--fb);font-weight:400;font-size:11.5px;color:var(--muted);padding:3px 8px;border-radius:7px;display:inline-flex;align-items:center}
.bplg button[aria-pressed=true]{color:var(--ink);background:rgba(255,255,255,.05)}
.lgd.dash{background:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 5px)}
.bpch{position:relative}
.bptip{position:absolute;top:4px;min-width:160px;padding:8px 10px;border-radius:10px;background:#0A0F1C;border:1px solid var(--line2);font-size:12px;pointer-events:none;box-shadow:0 20px 40px -20px #000;z-index:2}
.bptip b{display:block;font-family:var(--fd);font-weight:500;margin-bottom:4px}
.bptip span{display:flex;align-items:center;gap:6px;color:var(--soft);padding:1px 0}
.bptip i{width:10px;height:2px;border-radius:2px}
.bptip em{font-style:normal;margin-inline-start:auto;color:var(--ink)}
.bpchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.bploss{color:var(--bad);font-weight:500;display:block}
table.bpt td .lnk{font-size:11.5px;display:block;margin-top:2px}
body.bp-mode .al,body.bp-mode .gport,body.bp-mode .sl{display:none!important}
body.bp-mode .wl{opacity:0!important;pointer-events:none}
body.bp-mode .chat:not(.open) .peek{display:none}
body.bp-mode .live:not(.on){min-height:0;height:0;overflow:hidden}
body.bp-mode .zoe-tag span{white-space:normal;text-align:center;max-width:220px;font-size:11.5px}

/* ---- planet focus ---- */
.ffog{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.1s var(--ease);
  background:radial-gradient(560px 440px at var(--fx,50%) var(--fy,50%),color-mix(in srgb,var(--c) 15%,transparent),transparent 72%),radial-gradient(130% 100% at var(--fx,50%) var(--fy,50%),transparent 45%,rgba(2,4,9,.38) 100%)}
.ffog.on{opacity:1}
.fcard{display:flex;flex-direction:column;align-items:flex-start;gap:1px;max-width:170px;padding:7px 10px 8px;border-radius:12px;text-align:start;
  background:rgba(7,11,21,.82);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 14px 30px -18px #000;opacity:0;transition:opacity .6s var(--ease),border-color .25s,box-shadow .25s;text-shadow:none;white-space:normal}
.fcard.on{opacity:var(--d,1)}
.fcard:hover{border-color:var(--c);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent),0 18px 36px -16px #000;opacity:1}
.fcard em{font-style:normal;display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--c)}
.fcard em i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.fcard b{font-weight:500;font-size:12.5px;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.ftitle{display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto;opacity:0;text-shadow:0 1px 10px #000}
.ftitle b{font-family:var(--fd);font-weight:500;font-size:17px;color:var(--ink)}
.ftitle b::after{content:"";display:block;height:1.5px;margin:3px auto 0;width:60%;border-radius:2px;background:var(--c)}
.ftitle span{font-size:11.5px;color:var(--soft)}
.ftitle .fmore{font-size:11px;color:var(--c);margin-top:2px}
.ftitle .fx{position:absolute;top:-4px;inset-inline-end:-30px;width:24px;height:24px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.ftitle .fx:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.ftitle .fx svg{width:14px;height:14px}
body.focusing .zoe-tag{opacity:.35!important}
body.focusing .al{display:none}
@media (max-width:900px){.fcard{max-width:130px}.fcard span{display:none}}
.fcard.compact{max-width:128px;padding:5px 9px}.fcard.compact span{display:none}.fcard.compact b{font-size:12px;-webkit-line-clamp:1}

/* ---- full planet focus mode ---- */
body.fmode .zoe-tag,body.fmode .gport,body.fmode .wl,body.fmode .al,body.fmode .sl{opacity:0!important;pointer-events:none}

.ftitle{gap:3px}

.ftitle .fta button:hover{color:var(--ink);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.ftitle .fta svg{width:12px;height:12px}
.ftitle .fx{position:static!important;width:auto!important}
body.fmode .fcard{max-width:190px;padding:8px 11px 9px}
body.fmode .fcard b{font-size:13px}
.fpop{position:fixed;z-index:33;width:260px;padding:12px 14px;border-radius:14px;background:rgba(8,12,23,.96);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);box-shadow:0 30px 60px -24px #000,0 0 0 1px rgba(255,255,255,.02);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:popIn .35s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98)}}

.fph em{font-style:normal;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--c)}
.fph em i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.fpx{margin-inline-start:auto;width:24px;height:24px;display:grid;place-items:center;border-radius:7px;color:var(--muted)}
.fpx:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.fpx svg{width:13px;height:13px}
.fpop>b{display:block;font-family:var(--fd);font-weight:500;font-size:15px;margin-top:6px;line-height:1.45}
.fpm{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.fpop dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:10px 0 0;font-size:12.5px}
.fpop dt{color:var(--faint)}.fpop dd{margin:0;color:var(--soft)}
.fpa{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

  .gport span,.sl{display:none}
}

<script>
/* ==========================================================================
   Neptune — Memory Ring (Graphify around ZOE)            memory-ring.js
   Drop-in module for three.js r128. No other dependencies.

   Design
   - Six calm orbital lanes, one per memory kind (inner = most important).
     Fine dust flows along each lane; inner lanes move a little faster.
   - Each real memory is a node riding its lane. Current = bright core,
     old = small grey, unverified = hollow ring that flickers.
   - Relations are arcs that hug the ring (never straight lines through ZOE).
     Idle: only a few faint ones. Hover/select: the node's relations light up
     with light flowing along them.
   - Idle life: every few seconds a soft "thought" travels along a relation.
   - Events: save (birth + wave along its lane), retrieve (flare + flow),
     supersede (old dims, new is born, dashed "استُبدلت" arc), focus(workspace).

   Usage
     const ring = NeptuneMemoryRing({THREE, parent: zoeGroup, camera, dom: canvas,
                    portAngle: 3.75, portWorld: () => portPos, onSelect: id => openMemory(id)});
     ring.setMemories([{id, group:'dec'|'upd'|'info'|'res'|'src'|'proj', title, value,
                        status:'current'|'old'|'unverified', ws:['purchases'], importance:0..1, rel:[ids]}]);
     // every frame:  ring.tick(dt)          // update one memory:  ring.updateMemory(mem)
     ring.save(mem)  ring.retrieve(id)  ring.supersede(oldId, newMem)  ring.focus('debts'|null)
     ring.nodeWorld(id, outVec3)   ring.wave()   ring.select(id|null)   ring.setQuality('high'|'medium'|'low')
   ========================================================================== */
(function (global) {
  'use strict';
  function NeptuneMemoryRing(opts) {
    const THREE = opts.THREE || global.THREE, V3 = THREE.Vector3;
    const lin = h => new THREE.Color(h).convertSRGBToLinear();
    const camera = opts.camera, dom = opts.dom, parent = opts.parent;
    const RM = global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const DPR = opts.pixelRatio || Math.min(global.devicePixelRatio || 1, 1.5);
    const GROUPS = opts.groups || [
      { k: 'dec', n: 'قرارات', c: '#E6A957' }, { k: 'upd', n: 'تحديثات', c: '#74D1A2' },
      { k: 'info', n: 'معلومات', c: '#74CBE4' }, { k: 'res', n: 'نتائج الوكلاء', c: '#B3A4EC' },
      { k: 'src', n: 'مصادر', c: '#D6E8F4' }, { k: 'proj', n: 'مشاريع', c: '#7FA8EE' }];
    const NL = GROUPS.length, GI = {}; GROUPS.forEach((g, i) => GI[g.k] = i);
    const R0 = opts.inner || 1.66, GAP = opts.laneGap || .128, LW = opts.laneWidth || .085;
    const laneR = i => R0 + i * GAP;
    const BASE_SPEED = opts.speed || .026;
    const laneSpeed = i => (RM ? 0 : BASE_SPEED * Math.pow(R0 / laneR(i), 1.5));
    const PORT_A = opts.portAngle != null ? opts.portAngle : 3.75;
    let T = 0, quality = opts.quality || 'high';
    const hash = s => { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; };

    /* ---------- containers ---------- */
    const plane = new THREE.Group(); plane.rotation.set(...(opts.tilt || [-1.32, .18, .06])); parent.add(plane);

    /* ---------- shared uniforms ---------- */
    const laneI = new Array(NL).fill(1), laneC = GROUPS.map(g => lin(g.c));
    const U = {
      uT: { value: 0 }, uPR: { value: DPR }, uI: { value: 1 },
      uLane: { value: laneI }, uCol: { value: laneC },
      uR: { value: GROUPS.map((g, i) => laneR(i)) }, uSp: { value: GROUPS.map((g, i) => laneSpeed(i)) },
      uHot: { value: -1 }, uWA: { value: 0 }, uWT: { value: 99 }, uWL: { value: -1 }
    };

    /* ---------- lane dust (all motion on the GPU) ---------- */
    let dust = null;
    function buildDust() {
      if (dust) { plane.remove(dust); dust.geometry.dispose(); }
      const per = { high: 1100, medium: 560, low: 220 }[quality] || 1100, N = per * NL;
      const lane = new Float32Array(N), a0 = new Float32Array(N), dr = new Float32Array(N), s = new Float32Array(N), ph = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        lane[i] = i % NL; a0[i] = Math.random() * Math.PI * 2;
        const g = (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; dr[i] = g * LW * .55;
        s[i] = Math.pow(Math.random(), 3.2); ph[i] = Math.random() * 6.28;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
      [['lane', lane], ['a0', a0], ['dr', dr], ['s', s], ['ph', ph]].forEach(([n, a]) => geo.setAttribute(n, new THREE.BufferAttribute(a, 1)));
      const mat = new THREE.ShaderMaterial({
        uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        vertexShader: `
          attribute float lane,a0,dr,s,ph;
          uniform float uT,uPR,uI,uHot,uWA,uWT,uWL;uniform float uLane[${NL}];uniform float uR[${NL}];uniform float uSp[${NL}];uniform vec3 uCol[${NL}];
          varying vec3 vC;varying float vA;
          void main(){
            int li=int(lane+.5);float r=0.,sp=0.,lf=1.;vec3 c=vec3(1.);
            for(int k=0;k<${NL};k++){if(k==li){r=uR[k];sp=uSp[k];lf=uLane[k];c=uCol[k];}}
            float ang=a0+uT*sp*(1.+dr*2.);float rr=r+dr;
            vec3 p=vec3(cos(ang)*rr,sin(ang)*rr,dr*.25*sin(a0*9.));
            vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;
            float d=abs(atan(sin(ang-uWA),cos(ang-uWA)));
            float w=exp(-pow((d-uWT*2.4)*3.2,2.))*exp(-uWT*.75)*step(0.,uWT);
            if(uWL>-.5&&abs(uWL-lane)>.5)w*=.18;
            float hot=(uHot>-.5&&abs(uHot-lane)<.5)?1.:0.;
            float tw=.78+.22*sin(uT*(.5+s*1.6)+ph);
            vA=((.15+s*.62)*tw*lf+w*1.6+hot*.2)*uI;
            vC=mix(c,vec3(.82,.9,1.),.4);
            gl_PointSize=(1.4+s*3.+w*2.4+hot*.7)*uPR*(10./-mv.z);
          }`,
        fragmentShader: `varying vec3 vC;varying float vA;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(vC*vA*smoothstep(.5,.0,d),1.);}`
      });
      dust = new THREE.Points(geo, mat); dust.frustumCulled = false; dust.userData.nmr = true; plane.add(dust);
    }
    buildDust();

    /* ---------- faint lane guides (structure, not decoration) ---------- */
    const guides = GROUPS.map((g, i) => {
      const pts = []; for (let k = 0; k <= 256; k++) { const a = k / 256 * Math.PI * 2; pts.push(new V3(Math.cos(a) * laneR(i), Math.sin(a) * laneR(i), 0)); }
      const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: laneC[i], transparent: true, opacity: .035, blending: THREE.AdditiveBlending, depthWrite: false }));
      plane.add(l); return l;
    });

    /* ---------- memory nodes (one Points object, per-node attributes) ---------- */
    const CAP = opts.capacity || 1500;
    const nPos = new Float32Array(CAP * 3), nCol = new Float32Array(CAP * 3), nSz = new Float32Array(CAP), nAl = new Float32Array(CAP), nK = new Float32Array(CAP), nGl = new Float32Array(CAP);
    const ngeo = new THREE.BufferGeometry();
    ngeo.setAttribute('position', new THREE.BufferAttribute(nPos, 3)); ngeo.setAttribute('col', new THREE.BufferAttribute(nCol, 3));
    ngeo.setAttribute('sz', new THREE.BufferAttribute(nSz, 1)); ngeo.setAttribute('al', new THREE.BufferAttribute(nAl, 1));
    ngeo.setAttribute('kind', new THREE.BufferAttribute(nK, 1)); ngeo.setAttribute('gl', new THREE.BufferAttribute(nGl, 1));
    ngeo.setDrawRange(0, 0);
    const nodeMat = new THREE.ShaderMaterial({
      uniforms: { uPR: U.uPR, uT: U.uT }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: `attribute vec3 col;attribute float sz,al,kind,gl;uniform float uPR;varying vec3 vC;varying float vA,vK,vG;
        void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;vC=col;vA=al;vK=kind;vG=gl;gl_PointSize=sz*(1.+gl*.7)*uPR*(10./-mv.z);}`,
      fragmentShader: `uniform float uT;varying vec3 vC;varying float vA,vK,vG;
        void main(){vec2 q=gl_PointCoord-.5;float d=length(q)*2.;if(d>1.)discard;
          float core=smoothstep(.34,.0,d);float halo=exp(-d*d*4.)*.7;float ring=smoothstep(.12,.0,abs(d-.58));
          vec3 c;float a;
          if(vK>1.5){float f=.65+.35*sin(uT*3.3+vC.r*20.);a=(ring*.95+halo*.25)*f;c=vC;}
          else if(vK>.5){a=core*.45+halo*.15;c=vec3(.5,.56,.64);}
          else{a=core+halo;c=mix(vC,vec3(1.),core*.55);}
          c*=1.+vG*1.4;gl_FragColor=vec4(c*a*vA,1.);}`
    });
    const nodePts = new THREE.Points(ngeo, nodeMat); nodePts.frustumCulled = false; nodePts.userData.nmr = true; plane.add(nodePts);

    const nodes = [], byId = {};
    let focusWs = null, hoverId = null, selectId = null;
    function makeNode(m, born) {
      if (byId[m.id]) return Object.assign(byId[m.id], { m });
      if (nodes.length >= CAP) return null;
      const li = GI[m.group] != null ? GI[m.group] : GI.info;
      const n = { id: m.id, m, i: nodes.length, lane: li, a0: hash(m.id) * Math.PI * 2, dr: (hash(m.id + '#') - .5) * LW * .9,
        glow: 0, born: born ? performance.now() : 0, op: born ? 0 : 1, focus: 1, breath: hash(m.id + '~') * 6.28 };
      if (born) n.a0 = PORT_A - T * laneSpeed(li); // born next to the Graphify port
      nodes.push(n); byId[m.id] = n; paintNode(n); ngeo.setDrawRange(0, nodes.length); return n;
    }
    function paintNode(n) {
      const c = laneC[n.lane].clone().lerp(new THREE.Color(1, 1, 1), .25);
      nCol[n.i * 3] = c.r; nCol[n.i * 3 + 1] = c.g; nCol[n.i * 3 + 2] = c.b;
      const st = n.m.status; nK[n.i] = st === 'unverified' ? 2 : st === 'old' ? 1 : 0;
      const imp = n.m.importance != null ? n.m.importance : .45;
      n.baseSz = (st === 'old' ? 4 : 6) + imp * 7;
      ngeo.attributes.col.needsUpdate = true; ngeo.attributes.kind.needsUpdate = true;
    }
    const angleOf = n => n.a0 + T * laneSpeed(n.lane) * (1 + n.dr * 2);
    const radiusOf = n => laneR(n.lane) + n.dr;
    function localPos(n, out) { const a = angleOf(n), r = radiusOf(n); return out.set(Math.cos(a) * r, Math.sin(a) * r, 0); }

    /* ---------- relations: arcs that hug the ring ---------- */
    const rels = []; // {a,b,dashed,imp}
    const POOL = 56, pool = [];
    for (let i = 0; i < POOL; i++) {

  if(id!==runId)return;await wait(900);if(id!==runId)return;

  finEl.innerHTML=`<i></i><span>${fin.t}</span>${fin.mem?`<button class="lk" data-why="${fin.mem}">ليش تعرف هذا؟</button><button class="lk" data-mem="${fin.mem}">التفاصيل</button>`:''}`;

function route(s,file){
  const lines=s.split(/\n/).filter(x=>x.trim());const fr=/fridgy|فريجي/i.test(s);
  if(fr&&/محلل|محلّل/.test(s))return flowAnalyst();
  if(fr&&/سعر/.test(s)&&/شكد|كم|شنو|؟|\?/.test(s))return flowRecall();
  const num=(s.match(/(\d+(?:\.\d+)?)/)||[])[1];
  if(fr&&num&&/سعر/.test(s))return flowPrice(num,s);
  if(zoeRoute(s,file))return;
  const brandy=/(LG|Samsung|Hisense|Gree|سامسونج|هايسنس)/i.test(s)&&(s.match(/\d{2,}/g)||[]).length>=2;
  if((activeWs==='purchases'&&lines.length>=2)||(lines.length>=3&&brandy))return flowList(s);
  if(activeWs==='purchases'&&/قائمة|القائمة/.test(s)){say('zoe',zp('الصق القائمة، وأصنّفها وأقارنها بالسابقة.'));openListDrawer();return memRun([{t:'ينتظر القائمة',k:'skip'}],{t:'فتحت لك مكان القائمة',k:'skip'});}
  if(/شنو\s*(أشتري|اشتري|نشتري)|اقترح شراء/.test(s))return flowBuyPlan();
  if(/شنو ناقص|النواقص/.test(s))return flowScoped('purchases','النواقص',PUR.missing.map(m=>[m.p,m.why]));
  if(/تغيرات الأسعار|تغيّرات/.test(s))return flowScoped('purchases','تغيرات الأسعار',PUR.changes.map(c=>[c.n,dl(c.o,c.v)]));
  if(/مقارنة الأسعار|قارن/.test(s))return flowResearch();
  const pay=s.match(/^(.+?)\s+(?:دفع|دفعت|سدد|سددت|سدّد|سدّدت)\s+([\d.,]+)\s*(ألف|الف|مليون)?/);if(pay)return flowPayment(pay);
  if(/متأخر/.test(s)&&(activeWs==='debts'||/دين|ديون|منو/.test(s)))return flowScoped('debts','المتأخرون أكثر من شهرين',DEBTS.filter(d=>d.late>60).map(d=>[d.name,`<span class="ltr">${fmt(rem(d))}</span>، ${d.late} يوماً`]));
  if(/حملة/.test(s)&&/أريد|اريد|سوي|سوّي|ابدأ/.test(s))return flowCampaign(s);
  if((activeWs==='marketing'||/منشور|إعلان|اعلان/.test(s))&&/منشور|إعلان|اعلان|تصميم|فكرة عرض|مراجعة حملة/.test(s))return flowMktTask(s);
  if(/لخّص|لخص/.test(s))return flowBrief();
  if(/ذكرني|ذكّرني|سجل|سجّل|دين على/.test(s))return flowSaveTask(s);
  say('zoe',zp(/^(مرحبا|هلا|السلام)/.test(s)?'هلا حسين. شنو نسوي اليوم؟ اسألني، أو أرسل قائمة، أو ارفع تقرير اليوم.':/شلون/.test(s)?'بخير، شكراً حسين. شنو نشتغل عليه اليوم؟':'تمام. ما لقيت بيها شي يستاهل الحفظ بالذاكرة.'));
  memRun([{t:'لا يوجد شيء يستحق الحفظ',k:'skip'}],{t:'لم يُحفظ شيء، الرسالة لا تحتوي معلومة دائمة',k:'skip'});

function bpDrawTrend(){const svg=document.getElementById('bpTrend');const D=BP.data;if(!svg||!D||!D.series)return;if(!svg._ro&&window.ResizeObserver){let lw=0;svg._ro=new ResizeObserver(()=>{const cw=Math.round(svg.clientWidth);if(cw&&Math.abs(cw-lw)>2){lw=cw;bpDrawTrend();}});svg._ro.observe(svg);}
  const w=svg.clientWidth||700,h=220,pad={t:14,r:8,b:26,l:58};const data=D.series.points;const n=data.length;if(n<1)return;const cur=D.currency;

  const mS=Math.max(1,...vals('sales'))*1.1,mP=Math.max(1,...small.flatMap(k=>vals(k)))*1.15,mN=Math.min(0,...small.flatMap(k=>vals(k)));

  const ST={net:'stroke-width="2.6"',sales:'stroke-width="1.8" opacity=".75"',gross:'stroke-width="1.8"',exp:'stroke-width="1.2" stroke-dasharray="4 4" opacity=".45"'};let o='';

  const step=Math.max(1,Math.round(n/6));const lab=d=>d.date===D.today?'اليوم':`${+d.date.slice(8)}/${+d.date.slice(5,7)}`;
  data.forEach((d,i)=>{if((n-1-i)%step===0)o+=`<text x="${i===n-1?x(i)-2:x(i)}" y="${h-7}" fill="#8A93A6" font-size="10.5" text-anchor="${i===n-1?'start':'middle'}" font-family="Alexandria">${lab(d)}</text>`;});
  keys.forEach(k=>{const m=k==='sales'?mS:mP,lo=k==='sales'?0:mN;let seg=[];const flush=()=>{if(seg.length>1)o+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${C[k]}" ${ST[k]} stroke-linejoin="round"/>`;seg=[];};
    data.forEach((d,i)=>{if(d[k]==null){flush();return;}seg.push(`${x(i).toFixed(1)},${y(d[k],m,lo).toFixed(1)}`);if(k!=='exp')o+=`<circle cx="${x(i).toFixed(1)}" cy="${y(d[k],m,lo).toFixed(1)}" r="${i===n-1?(k==='net'?4:3):1.6}" fill="${C[k]}"/>`;});flush();});
  o+=`<line id="bpCur" x1="0" x2="0" y1="${pad.t}" y2="${h-pad.b}" stroke="rgba(232,228,218,.35)" visibility="hidden"/>`;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=o;const tip=document.getElementById('bpTip');
  const near=e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*(w/r.width);let bi=0,bd=1e9;data.forEach((d,i)=>{const dd=Math.abs(x(i)-px);if(dd<bd){bd=dd;bi=i;}});return {bi,r};};
  svg.onmousemove=e=>{const {bi,r}=near(e);const d=data[bi];const cu=svg.querySelector('#bpCur');cu.setAttribute('x1',x(bi));cu.setAttribute('x2',x(bi));cu.setAttribute('visibility','visible');
    tip.hidden=false;tip.innerHTML=`<b>${d.date===D.today?'اليوم':dDate(d.date,true)}</b>${d.reportId?[['net','الصافي'],['sales','المبيعات'],['gross','ربح البضاعة'],['exp','المصاريف']].filter(([k])=>keys.includes(k)).map(([k,l])=>`<span><i style="background:${C[k]}"></i>${l}<em class="ltr">${txt(mny(d[k],cur))}</em></span>`).join(''):'<span>لا يوجد تقرير معتمد</span>'}`;
    const left=x(bi)/w*r.width;tip.style.left=Math.min(r.width-170,Math.max(0,left-80))+'px';svg.style.cursor=d.reportId?'pointer':'';};
  svg.onmouseleave=()=>{tip.hidden=true;const cu=svg.querySelector('#bpCur');if(cu)cu.setAttribute('visibility','hidden');};

/* agent tasks: created server-side from references; results come back through polling */
async function sendTask(a,btn){if(btn)btn.disabled=true;const who=AGT[a.agent];
  const body={agent:a.agent,kind:a.task,productKey:a.productKey,category:a.category,metric:a.metric,question:a.question,ref:a.ref,reason:a.reason?txt(a.reason):undefined,...perCtx()};
  convoOpen();say('me',esc(`${a.label}${a.title?`: ${txt(a.title)}`:''}`));memStart();
  try{const t=await api('/api/agents/tasks',{method:'POST',body:JSON.stringify(body)});BP.tasks[t.id]=t.status;trackTask(t);
    const q=t.status==='queued'&&t.status_reason;
    zSay(zp(`أنشأت مهمة لـ<b>${who.n}</b>: «${esc(t.title)}» (#${t.id}).${q?` <span style="color:var(--wait)">${esc(t.status_reason)}</span>`:' يشتغل عليها الآن.'}`)+`<div class="btns"><button class="btn" data-act="bpTask" data-arg="${t.id}">فتح المهمة</button>${a.agent==='purchasing'?'<button class="btn" data-act="openPurch">فتح المشتريات</button>':''}</div>`);
    if(who.id&&t.status==='running')setAgent(who.id,'working',t.title.slice(0,34));
    memRun([{t:`زوي تكلّف ${who.n}`,k:'think'},{t:'يبني السياق من قاعدة البيانات',k:'check'}],{t:q?`مهمة محفوظة، تنتظر مشغّل الوكلاء`:`${who.n} يعمل على المهمة`,k:q?'dec':'use'});
    toast(`مهمة #${t.id}: ${who.n}`);if(activeWs==='pulse')bpLoad({quiet:true});else if(activeWs)renderWs();}
  catch(e){zSay(zp(`تعذّر إنشاء المهمة: ${esc(e.message)}`));memRun([{t:'فشل إنشاء المهمة',k:'skip'}],{t:'لم تُنشأ مهمة',k:'skip'});}
  finally{if(btn)btn.disabled=false;}}
let pollT=null;
function trackTask(t){BP.tasks[t.id]=t.status;if(t.status==='running'||(t.status==='queued'&&BP.health&&BP.health.claude.enabled))ensurePoll();}
function ensurePoll(){if(pollT)return;pollT=setInterval(async()=>{const open=Object.entries(BP.tasks).filter(([,s])=>s==='running'||s==='queued');if(!open.length){clearInterval(pollT);pollT=null;return;}
  try{const {tasks}=await api('/api/agents/tasks?limit=40');tasks.forEach(t=>{const was=BP.tasks[t.id];if(was===undefined){if(t.parent_task_id&&BP.tasks[t.parent_task_id]!==undefined)BP.tasks[t.id]=t.status;else return;}
    if(was!==t.status){BP.tasks[t.id]=t.status;const who=AGT[t.agent];

  const b=c.baselines.yesterday||c.baselines.prev;const cur=c.currency;

    `<table class="dt bpt"><thead><tr><th></th><th>${mode==='day'?dDate(c.period.anchor):'الحالية'}</th><th>${mode==='day'?'أمس':'السابقة'}</th><th>الفرق</th></tr></thead><tbody>${['sales','gross_profit','expenses','other_revenue','net_profit','units_sold'].map(k=>`<tr><td>${FL[k]}</td><td>${k==='units_sold'?c.current[k]??'—':mny(c.current[k],cur)}</td><td>${k==='units_sold'?b.values[k]??'—':mny(b.values[k],cur)}</td><td>${dlt(b.delta[k],k==='expenses')}</td></tr>`).join('')}</tbody></table>
    <div class="bpnote">${mode==='day'?'':`الحالية ${c.current.reports} تقارير (${dDate(c.period.from)} – ${dDate(c.period.to)})، السابقة ${b.values.reports} تقارير (${dDate(b.from)} – ${dDate(b.to)}).`}${c.baselines.avg7?` متوسط ${c.baselines.avg7.reports} تقارير سابقة للمصاريف: ${txt(mny(c.baselines.avg7.values.expenses,cur))}.`:''}</div>`;
  overlayRep(head+`<div class="wpath">${seg}${body}</div>`);bindCmp();

const repEl=$('#rep');
function overlayRep(h){$('#repBox').innerHTML=h;repEl.classList.add('open');$('#repBox').querySelectorAll('[data-rx]').forEach(b=>b.onclick=stop(closeRep));}
function closeRep(){repEl.classList.remove('open');BP.rep=null;}
repEl.onclick=e=>{e.stopPropagation();if(e.target===repEl)closeRep();};
const rsteps=i=>`<div class="rsteps">${['رُفع','قراءة','مراجعة','معتمد'].map((l,k)=>`<span class="${k<i?'done':k===i?'on':''}"><i></i>${l}</span>`).join('')}</div>`;
const rhead=(t,p)=>`<div class="why-h"><div><h3>${t}</h3><p>${p}</p></div><button class="iconb" data-rx aria-label="إغلاق">${XS}</button></div>`;
const filePick=document.createElement('input');filePick.type='file';filePick.accept='application/pdf,.pdf';filePick.hidden=true;document.body.appendChild(filePick);
let filePickCb=null;filePick.onchange=()=>{const f=filePick.files[0];filePick.value='';if(f&&filePickCb)filePickCb(f);};
function pickPdf(cb){filePickCb=cb;filePick.click();}
async function openRep(step,arg={}){BP.rep=step;
  if(step==='upload'){overlayRep(rhead('إضافة تقرير يومي','لا يدخل أي رقم للنظام قبل اعتمادك')+`<div class="wpath">${rsteps(0)}<div class="bpdrop" id="rDrop"><b>اسحب ملف PDF هنا</b><span>أو أرسله لزوي بالمحادثة، هي تعرف إنه تقرير يومي.</span><button class="btn pri" id="rPick">اختيار ملف PDF</button></div></div>`);
    $('#rPick').onclick=stop(()=>pickPdf(f=>openRep('processing',{file:f})));const dz=$('#rDrop');
    dz.ondragover=e=>{e.preventDefault();dz.style.borderColor='var(--amber)';};dz.ondragleave=()=>{dz.style.borderColor='';};
    dz.ondrop=e=>{e.preventDefault();dz.style.borderColor='';const f=e.dataTransfer.files[0];if(f)openRep('processing',{file:f});};return;}
  if(step==='processing'){const f=arg.file;if(!f)return;if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf')return openRep('error',{message:'الملف ليس PDF.'});
    overlayRep(rhead(`تقرير <span class="ltr">${esc(f.name)}</span>`,'زوي تقرا التقرير…')+`<div class="wpath">${rsteps(1)}<div class="sk" style="height:16px;width:60%"></div><div class="sk" style="height:12px;margin-top:10px"></div><div class="sk" style="height:12px;width:80%;margin-top:10px"></div><div class="bpnote" id="rProg">يرفع ${Math.round(f.size/1024)} ك.ب…</div></div>`);
    let r;try{const buf=await f.arrayBuffer();const p=$('#rProg');if(p)p.textContent='يستخرج النص ويتحقق من الأرقام…';
      r=await api('/api/pulse/reports',{method:'POST',body:buf,headers:{'content-type':'application/pdf','x-filename':encodeURIComponent(f.name)}});}
    catch(e){if(e.code==='DUPLICATE_REPORT'&&e.sameFile)return openRep('duplicate',{existing:e.existingReportId,name:f.name});return openRep('error',{message:e.message,code:e.code});}
    bpRefreshAll();if(r.validation==='FAILED')return openRep('error',{message:r.error_message,code:r.error_code,report:r});return openRep('review',{report:r});}
  if(step==='duplicate'){overlayRep(rhead('الملف مرفوع سابقاً','نفس التقرير لا يدخل مرتين')+`<div class="wpath">${rsteps(1)}<p style="margin:0 0 12px;color:var(--soft);line-height:1.8">هذا الملف نفسه (<bdi>${esc(arg.name)}</bdi>) موجود في نيبتون. ما رفعته مرة ثانية.</p><div class="actions"><button class="btn pri" id="rSeen">عرض التقرير الموجود</button><button class="btn" data-rx>إلغاء</button></div></div>`);
    $('#rSeen').onclick=stop(()=>{closeRep();bpReport(arg.existing);});return;}
  if(step==='review'){let r=arg.report;if(!r){overlayRep(rhead('مراجعة التقرير قبل الاعتماد','يحمّل…')+`<div class="wpath">${rsteps(2)}<div class="sk" style="height:140px"></div></div>`);try{r=await api(`/api/pulse/reports/${arg.id}`);}catch(e){return openRep('error',{message:e.message});}}
    if(r.status!=='pending'){closeRep();return bpReport(r.id);}
    const cur=r.currency,fails=r.checks.filter(c=>c.status==='fail'),failF=new Set(fails.map(c=>c.field).filter(Boolean)),ack=!!arg.ack;
    const fieldRow=k=>{const f=r.fields.find(x=>x.field===k);const v=r[k];const bad=failF.has(k)||(f&&f.confidence==='unclear');const src=f&&f.page?`الصفحة ${f.page}، سطر ${f.line_no}`:f&&f.confidence==='calculated'?'غير مطبوع، محسوب':'غير موجود في التقرير';
      return `<div class="rvr"><span>${FL[k]}<small>${src}</small></span>${bad?`<input data-corr="report" data-f="${k}" value="${v!=null?v:''}" inputmode="decimal" aria-label="${FL[k]}">`:`<span class="ltr num">${v!=null?(k==='units_sold'?v:v.toLocaleString('en-US',{minimumFractionDigits:2})):'—'}</span>`}<span class="tag ${bad?'amber':f&&f.confidence==='calculated'?'mem':'ok'}">${bad?'يحتاج مراجعة':f&&f.confidence==='calculated'?'محسوب':'✓ مؤكد'}</span></div>`;};
    const unclear=[...r.products.filter(p=>p.confidence!=='ok').map(p=>({e:'product',id:p.id,f:'profit',l:p.name,v:p.profit,src:`الصفحة ${p.page}، سطر ${p.line_no}`})),...r.expenses.filter(x=>x.confidence!=='ok').map(x=>({e:'expense',id:x.id,f:'amount',l:`مصروف ${x.name}`,v:x.amount,src:`الصفحة ${x.page}، سطر ${x.line_no}`}))];
    const conflict=r.conflict;
    overlayRep(rhead('مراجعة التقرير قبل الاعتماد',r.report_date?`التاريخ المكتشف: ${dDate(r.report_date,true)}، <bdi>${esc(r.original_name)}</bdi>`:`<bdi>${esc(r.original_name)}</bdi>: لم يُعثر على تاريخ`)+`<div class="wpath">${rsteps(2)}
      ${fails.length?`<div class="bpban amber" style="margin:0 0 10px"><span>${fails.length===1?'قيمة واحدة ما كدرت أتأكد منها':`${fails.length} قيم ما كدرت أتأكد منها`}. راجعها قبل الاعتماد.<br>${fails.map(c=>`<small style="display:block;color:var(--muted)">${esc(c.message)}</small>`).join('')}</span></div>`:'<div class="bpban" style="margin:0 0 10px"><span>كل المجاميع مطابقة لسطور التقرير. راجع الأرقام واعتمد.</span></div>'}
      ${conflict?`<div class="bpban bad" style="margin:0 0 10px"><span><b>يوجد تقرير معتمد لنفس اليوم</b> (${dDate(conflict.report_date)}، صافي ${txt(mny(conflict.net_profit,cur))}). اعتماد هذا التقرير سيستبدله، والقديم يبقى في السجل.</span></div>`:''}
      ${!r.report_date?`<div class="rvr"><span>تاريخ التقرير<small>غير موجود في الملف</small></span><input type="date" id="rDate" style="direction:ltr"><span class="tag amber">مطلوب</span></div>`:''}
      ${!cur?`<div class="rvr"><span>العملة<small>غير مذكورة في الملف</small></span><select class="bpsel" id="rCur"><option value="">اختر</option><option value="USD">USD</option><option value="IQD">IQD</option></select><span class="tag amber">مطلوب</span></div>`:''}
      ${['sales','gross_profit','other_revenue','expenses','net_profit','units_sold'].map(fieldRow).join('')}
      ${unclear.map(u=>`<div class="rvr"><span>${esc(u.l)}<small>${u.src}، الرقم غير واضح</small></span><input data-corr="${u.e}" data-id="${u.id}" data-f="${u.f}" value="${u.v??''}" inputmode="decimal"><span class="tag amber">يحتاج مراجعة</span></div>`).join('')}
      <div class="bpnote">${r.products.length} منتجات، ${r.expenses.length} بنود مصاريف، ${r.otherRevenue.length} إيرادات أخرى${r.returns.length?`، ${r.returns.length} مرتجعات`:''}. العملة: ${esc(cur||'—')}. ${r.extraction_method==='ocr'?'قُرئ بـ OCR.':'قُرئ من طبقة النص.'}</div>
      ${ack?`<div class="bpban amber" style="margin:10px 0 0"><span>ما زالت هناك فروقات. الاعتماد الآن يعني أنك تقر بها، وتبقى مسجّلة في التقرير.</span></div>`:''}
      <div class="actions"><button class="btn pri" id="rOk">${ack?'اعتماد مع الفروقات':conflict?'استبدال واعتماد':'اعتماد التقرير'}</button><a class="btn" href="${pdfUrl(r.id)}" target="_blank" rel="noopener" style="display:inline-grid;place-items:center">عرض الملف</a><button class="btn" id="rCancel">${conflict?'إلغاء (الإبقاء على القديم)':'إلغاء'}</button></div></div>`);
    $('#rOk').onclick=stop(async()=>{const b=$('#rOk');b.disabled=true;const corrections=[];let bad=false;
      $('#repBox').querySelectorAll('[data-corr]').forEach(i=>{const v=parseFloat(String(i.value).replace(/,/g,''));if(isNaN(v)){bad=true;i.style.borderColor='var(--bad)';return;}
        const e=i.dataset.corr;const old=e==='report'?r[i.dataset.f]:e==='product'?(r.products.find(p=>p.id===+i.dataset.id)||{})[i.dataset.f]:(r.expenses.find(x=>x.id===+i.dataset.id)||{})[i.dataset.f];
        if(old==null||Math.abs(old-v)>1e-9)corrections.push({entity:e,entityId:i.dataset.id?+i.dataset.id:undefined,field:i.dataset.f,value:v,reason:'مراجعة قبل الاعتماد'});});

function zParse(t){return t.replace(/^(أريد|اريد)?\s*(أشتري|اشتري|شراء)[:：]?/,'').split(/\n|،|(?:\s+و)(?=\s*\d)/).map(x=>x.trim()).filter(Boolean).map(x=>{const qm=x.match(/[—-]\s*(\d+)\s*$/)||x.match(/^(\d+)/);const qty=qm?+qm[1]:1;
  let brand='—';ZBR.forEach(([k,v])=>{if(brand==='—'&&new RegExp(k,'i').test(x))brand=v;});const name=x.replace(/[—-]\s*\d+\s*$/,'').replace(/^\d+\s*/,'').trim();
  return {name,brand,qty,last:null,market:null};}).filter(i=>i.name&&/[a-zA-Z\u0600-\u06FF]/.test(i.name));}

  if((inPulse&&/حلل|حلّل|المحلل|المحلّل/.test(s))||/ليش.*(أرباح|ارباح|الربح)/.test(s)){sendTask({kind:'agent',agent:'analyst',task:'analyse',question:s,label:'اسأل المحلّل'},null,{chat:true});return true;}

  if(/(أشتري|اشتري|شراء)/.test(s)&&!/شنو/.test(s)&&s.split('\n').filter(x=>x.trim()).length<3){const items=zParse(s);if(!items.length)return false;

  const col=lin(hue);fGlow.material.color.copy(col);fHalo.material.color.copy(col).multiplyScalar(1.4);fOrbitLine.material.color.copy(col);
  fFog.style.setProperty('--c',hue);fFog.classList.add('on');document.body.classList.add('focusing');
  if(k==='graphify')gPulse=1.2;else if(k==='zoe')zoeFlash=1;}
function focusOff(){if(!FOCUS)return;const F=FOCUS;FOCUS=null;hidePop();F.els.forEach(el=>{el.classList.remove('on');setTimeout(()=>el.remove(),450);});
  fFog.classList.remove('on');document.body.classList.remove('focusing');}
/* details: a small card beside the item, never a big panel */
function showPop(x,el){const r=el.getBoundingClientRect();

  fPop.innerHTML=`<div class="fph"><em><i></i>${T_ICON[x.type]||''}</em><button class="fpx" aria-label="إغلاق">${XS}</button></div><b><bdi>${esc(x.title)}</bdi></b>${x.meta?`<span class="fpm">${esc(x.meta)}</span>`:''}
   ${(x.d||[]).length?`<dl>${x.d.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`:''}
   <div class="fpa">${(x.acts||[]).map((a,i)=>`<button class="btn ${i===0?'pri':''}" data-pa="${i}">${a[0]}</button>`).join('')}${x.fn?`<button class="btn" data-pf>التفاصيل الكاملة</button>`:''}<button class="btn" data-pz>اسأل زوي</button></div>`;
  fPop.hidden=false;const pw=fPop.offsetWidth,ph=fPop.offsetHeight;const [px]=FOCUS?proj(focusPos(FOCUS.k,fTmp)):[W/2];
  let left=r.left+r.width/2<px?r.left-pw-10:r.right+10;left=Math.max(10,Math.min(W-pw-10,left));let top=Math.max(70,Math.min(H-ph-100,r.top+r.height/2-ph/2));

  fPop.querySelector('.fpx').onclick=stop(hidePop);
  fPop.querySelectorAll('[data-pa]').forEach(b=>b.onclick=stop(()=>{hidePop();x.acts[+b.dataset.pa][1]();}));
  const pf=fPop.querySelector('[data-pf]');if(pf)pf.onclick=stop(()=>{hidePop();x.fn();});
  fPop.querySelector('[data-pz]').onclick=stop(()=>{hidePop();convoOpen();prefill(`${x.title}: `);});}
function hidePop(){fPop.hidden=true;if(FOCUS)FOCUS.hold=false;}
fPop.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',e=>{if(!fPop.hidden&&!e.target.closest('.fpop')&&!e.target.closest('.fcard'))hidePop();});
const fTmp=new V3(),fLoc=new V3();
function focusFrame(dt){const on=!!FOCUS;const k=on?FOCUS.k:null;
  if(on){FOCUS.a=Math.min(1,FOCUS.a+dt*1.2);if(!FOCUS.hold&&!RM)FOCUS.t+=dt;FOCUS.spin=.15*Math.sin(FOCUS.t*.15);}
  // Graphify's nucleus grows when it is the subject
  port.scale.setScalar(port.scale.x+(((on&&k==='graphify'&&FULL)?2.4:1)-port.scale.x)*.06);
  const P=on?focusPos(k,fTmp):fGlow.position;if(on){fGlow.position.copy(P);fHalo.position.copy(P);fOrbit.position.copy(P);}

  fGlow.material.opacity+=((on?(k==='zoe'?.18:.3):0)-fGlow.material.opacity)*.06;fGlow.scale.setScalar(r*(k==='zoe'?5.4:8));
  fHalo.material.opacity+=((on?.3+.08*Math.sin(T*1.5):0)-fHalo.material.opacity)*.06;fHalo.scale.setScalar(r*2.8*(1+.03*Math.sin(T*1.5)));
  const [px,py]=proj(P);const ppu=on?(proj(fLoc.copy(P).add(new V3(1,0,0)))[0]-px):pxPerUnit();
  const b=layout.b||{L:0,R:W,top:64,bottom:H-130};
  let rs=FULL?Math.min(W*.3,390,Math.max(150,(b.bottom-py-60)/.6),Math.max(150,(py-b.top-40)/.56)):Math.min(Math.max((b.R-b.L)*.3,120),215);
  rs=Math.max(rs,r*Math.abs(ppu)*1.9);const Rw=rs/Math.max(1,Math.abs(ppu));fOrbit.scale.setScalar(Rw);fOrbitLine.material.opacity+=((on?.24:0)-fOrbitLine.material.opacity)*.06;
  if(on){fFog.style.setProperty('--fx',px+'px');fFog.style.setProperty('--fy',py+'px');}
  if(on){const n=FOCUS.els.length;const settle=Math.min(1,FOCUS.a*1.4);FOCUS.els.forEach((el,i)=>{const ang=FOCUS.spin+Math.PI/2+.62+(i+.5)*(Math.PI*2-1.24)/n;fLoc.set(Math.cos(ang),Math.sin(ang),0).applyEuler(fOrbit.rotation).multiplyScalar(Rw*(.7+.3*settle)).add(P);
      const [x,y]=proj(fLoc);const front=-Math.sin(ang);const cx=Math.min(W-90,Math.max(90,x));
