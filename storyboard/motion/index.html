<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ---------------------------------------------------------------------------
// «خيالُ الظلّ: وقفةُ الحُرّ» — shadow-theatre motion graphic, 1080x1920, 29.57 s
// render(t) draws one deterministic frame for time t (seconds).
// ---------------------------------------------------------------------------
const W = 1080, H = 1920, DUR = 29.57;
const INK = '#0B0907', BURG = '#7E1F2D', BURG_L = '#B23A4A', AMBER = '#E8A54B', CREAM = '#EDE0C4';
const cv = document.getElementById('c'), C = cv.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;

// ---------- paper texture (once) ----------
const PAPER = document.createElement('canvas'); PAPER.width = W; PAPER.height = H;
(function () {
  const p = PAPER.getContext('2d'), r = rng(7);
  p.fillStyle = '#fff'; p.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) {
    const x = r() * W, y = r() * H, l = 6 + r() * 40, a = r() * Math.PI;
    p.strokeStyle = `rgba(90,60,30,${0.05 + r() * 0.12})`; p.lineWidth = 0.6 + r() * 1.2;
    p.beginPath(); p.moveTo(x, y); p.quadraticCurveTo(x + Math.cos(a) * l * .5 + r() * 6, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke();
  }
  for (let i = 0; i < 140; i++) {
    const x = r() * W, y = r() * H, rr = 30 + r() * 180;
    const g = p.createRadialGradient(x, y, 0, x, y, rr); g.addColorStop(0, `rgba(120,80,40,${0.04 + r() * .06})`); g.addColorStop(1, 'rgba(120,80,40,0)');
    p.fillStyle = g; p.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
})();

// ---------- stage helpers ----------
function stage(c, o) {

  g.addColorStop(0, o.top); g.addColorStop(o.midAt ?? 0.45, o.mid ?? o.top); g.addColorStop(1, o.bottom ?? INK);
  c.fillStyle = g; c.fillRect(0, 0, W, H);

function glow(c, x, y, r, col, a = 1) {

  const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); c.restore();

function floorDark(c, y = 1120) {
  const g = c.createLinearGradient(0, y - 60, 0, y + 160);
  g.addColorStop(0, 'rgba(11,9,7,0)'); g.addColorStop(0.45, 'rgba(11,9,7,0.93)'); g.addColorStop(1, 'rgba(11,9,7,1)');
  c.fillStyle = g; c.fillRect(0, y - 60, W, H - y + 60);
}
function tint(c, col, a, mode = 'multiply') { c.save(); c.globalCompositeOperation = mode; c.globalAlpha = a; c.fillStyle = col; c.fillRect(0, 0, W, H); c.restore(); }
function cam(c, p, cx, cy, s0, s1, dx = 0, dy = 0) { const s = lerp(s0, s1, p); c.translate(cx + dx * p, cy + dy * p); c.scale(s, s); c.translate(-cx, -cy); }

function shafts(c, x, y, ang, n, len, wid, col, a) {
  c.save(); c.globalCompositeOperation = 'screen'; c.translate(x, y); c.rotate(ang);
  for (let i = 0; i < n; i++) {
    const g = c.createLinearGradient(0, 0, 0, len); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.globalAlpha = a * (0.6 + 0.4 * Math.sin(i * 2.1)); c.fillStyle = g;
    c.beginPath(); c.moveTo(i * wid * 1.6, 0); c.lineTo(i * wid * 1.6 + wid, 0); c.lineTo(i * wid * 2.3 + wid * 1.8, len); c.lineTo(i * wid * 2.3, len); c.closePath(); c.fill();

}
function particles(c, seed, n, t, o) {
  const r = rng(seed);
  c.save(); c.fillStyle = o.col;
  for (let i = 0; i < n; i++) {
    const x0 = r() * (W + 400) - 200, y0 = r() * H, sp = o.speed * (0.6 + r() * 0.8), sz = o.size * (0.4 + r());
    let x = (x0 + o.vx * sp * t + Math.sin(t * 2 + i) * (o.wob ?? 6)) % (W + 400); if (x < -200) x += W + 400;
    let y = (y0 + o.vy * sp * t) % (o.maxY ?? H); if (y < 0) y += (o.maxY ?? H);
    c.globalAlpha = o.alpha * (0.5 + r() * 0.5);

// ---------- the man ----------
const GAR = {

  sack: { col: 'rgba(120,104,84,0.93)', hole: 'rgba(200,185,160,0.4)' },
  linen: { col: 'rgba(236,232,220,0.9)', hole: 'rgba(255,255,250,0.5)' },
  sand: { col: 'rgba(214,180,120,0.93)', hole: 'rgba(250,225,170,0.5)' },
  ochre: { col: 'rgba(176,122,52,0.95)', hole: 'rgba(240,190,110,0.5)' },
  umber: { col: 'rgba(92,62,36,0.96)', hole: 'rgba(170,120,70,0.45)' },
  straw: { col: 'rgba(214,188,104,0.93)', hole: 'rgba(250,230,160,0.5)' },
  soot: { col: 'rgba(84,80,76,0.95)', hole: 'rgba(160,150,140,0.4)' },
  charcoal: { col: 'rgba(52,48,46,0.96)', hole: 'rgba(130,120,110,0.4)' },
  merchant: { col: 'rgba(138,104,70,0.94)', hole: 'rgba(220,180,130,0.5)' },
  traveller: { col: 'rgba(110,80,52,0.95)', hole: 'rgba(200,160,110,0.45)' },
  sea: { col: 'rgba(64,112,98,0.95)', hole: 'rgba(150,210,190,0.45)' },
  white: { col: 'rgba(246,240,226,0.95)', hole: 'rgba(255,255,255,0.5)' },
  bisht: { col: 'rgba(20,16,14,0.97)', hole: 'rgba(200,160,90,0.5)' },
  burgundy: { col: 'rgba(126,31,45,0.97)', hole: 'rgba(210,90,110,0.45)' },

function J(x, y) { return { x, y }; }
function add(a, b) { return J(a.x + b.x, a.y + b.y); }
function pose(o) {

      const [K1, A1] = leg(sw, Math.max(0, -Math.sin(ph)) * 0.6), [K2, A2] = leg(-sw, Math.max(0, Math.sin(ph)) * 0.6);
      P = { H: H0, N: add(H0, J(o.lean ?? 4, -60)), K1, A1, K2, A2, aF: [-sw * 0.8, 0.3], aB: [sw * 0.8, 0.3] }; break;
    }
    case 'sit': P = { H: J(-4, -58), N: J(0, -118), K1: J(24, -60), A1: J(26, -6), K2: J(20, -58), A2: J(22, -6), aF: [0.9, 0.9], aB: [0.6, 0.8] }; break;
    case 'kneel': P = { H: J(-6, -48), N: J(2, -108), K1: J(14, -8), A1: J(-24, -4), K2: J(8, -6), A2: J(-28, -3), aF: [0.4, 0.5], aB: [0.2, 0.4] }; break;
    case 'crouch': P = { H: J(-12, -38), N: J(6, -94), K1: J(16, -46), A1: J(10, -3), K2: J(10, -42), A2: J(-4, -3), aF: [1.0, 0.6], aB: [0.7, 0.8] }; break;
    case 'bent': { const sw = Math.sin(ph) * 0.3; const H0 = J(0, -84);
      P = { H: H0, N: add(H0, J(22, -50)), K1: add(H0, J(Math.sin(sw) * 42 + 6, 40)), A1: add(H0, J(Math.sin(sw) * 44 + 2, 82)), K2: add(H0, J(-Math.sin(sw) * 42 + 6, 40)), A2: add(H0, J(-Math.sin(sw) * 44 + 2, 82)), aF: [0.5, 0.6], aB: [0.3, 0.5] }; break; }
    default: P = { H: J(0, -88), N: J(1, -148), K1: J(3, -46), A1: J(4, -4), K2: J(-2, -46), A2: J(-3, -4), aF: [0.15, 0.15], aB: [-0.1, 0.15] };
  }

}
function limb(c, A, a1, a2, l1, l2) { // angles from straight-down, positive = forward (+x)
  const E = add(A, J(Math.sin(a1) * l1, Math.cos(a1) * l1));
  const Hd = add(E, J(Math.sin(a1 + a2) * l2, Math.cos(a1 + a2) * l2));
  return [E, Hd];
}
function stroke(c, pts, w, col) { c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y); c.lineWidth = w; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); }
function curls(c, cx, cy, R, a0, a1, n, seed, size = 1) {
  const r = rng(seed); c.fillStyle = INK; c.strokeStyle = INK;
  for (let i = 0; i < n; i++) {
    const a = lerp(a0, a1, i / (n - 1)) + (r() - .5) * 0.12, rad = R + (r() - .3) * 2.2 * size;
    const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad, cr = (2.6 + r() * 2.4) * size;
    c.beginPath(); c.arc(x, y, cr, 0, 7); c.fill();

      c.lineWidth = 0.8 * size; c.beginPath();
      const tx = x + Math.cos(a) * cr, ty = y + Math.sin(a) * cr;
      c.moveTo(tx, ty); c.bezierCurveTo(tx + Math.cos(a + 1.2) * 4 * size, ty + Math.sin(a + 1.2) * 4 * size, tx + Math.cos(a - .6) * 6 * size, ty + Math.sin(a - .6) * 6 * size, tx + Math.cos(a + .3) * 7 * size, ty + Math.sin(a + .3) * 7 * size);

function headProfile(c, o) {

  c.lineTo(10.8, -0.6); c.lineTo(10.2, 1.2); c.lineTo(12.9, 5.4); c.lineTo(10.4, 6.8); c.lineTo(11.1, 8.1);
  [[11.6, 9.6], [10.5, 10.4], [11.3, 11.7], [9.9, 12.5], [10.5, 13.9], [8.7, 14.3], [8.9, 15.7], [6.9, 15.5], [6.5, 16.7], [4.5, 15.9], [3.5, 16.8], [1.9, 15.3], [0.4, 15.8], [-1.2, 14.2], [-4, 15], [-7.5, 13]].forEach(p => c.lineTo(p[0], p[1]));

    c.fillStyle = o.hood; c.beginPath(); c.moveTo(-17, 24); c.bezierCurveTo(-20, -8, -10, -20, 4, -19); c.bezierCurveTo(12, -18, 14, -10, 12.5, -2); c.lineTo(10, 4); c.lineTo(4, 6); c.quadraticCurveTo(-2, 10, -4, 24); c.closePath(); c.fill();
    c.strokeStyle = INK; c.lineWidth = 0.8; c.stroke();
    if (o.lining) { c.strokeStyle = BURG_L; c.lineWidth = 1.2; c.beginPath(); c.moveTo(11, -7); c.lineTo(6, -8); c.stroke(); }
    curls(c, 0, 0, 12.5, -0.95, -0.55, 4, o.seed ?? 3, 0.8);
  } else {
    curls(c, 0, 0, 12, Math.PI * 0.86, Math.PI * 2.0, 30, o.seed ?? 3);
    curls(c, 3, -3, 12.4, Math.PI * 1.78, Math.PI * 1.93, 4, (o.seed ?? 3) + 1, 0.9); // fringe over the forehead
  }
  if (o.wrap) { // head-cloth / head-rag band
    c.fillStyle = o.wrap; c.beginPath(); c.moveTo(-12, -6); c.quadraticCurveTo(0, -11, 10.5, -6.5); c.lineTo(10.2, -3.4); c.quadraticCurveTo(0, -7.5, -12.5, -2.2); c.closePath(); c.fill();
    if (o.wrapTail) { c.beginPath(); c.moveTo(-12, -4); c.quadraticCurveTo(-18, 0, -17, 8); c.lineTo(-14, 7); c.quadraticCurveTo(-15, 1, -11, -1); c.closePath(); c.fill(); }
  }

}
function headBack(c, o) {
  c.fillStyle = INK; c.beginPath(); c.ellipse(0, 0, 11.5, 13, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(-11.5, 1, 2.2, 3.4, 0, 0, 7); c.ellipse(11.5, 1, 2.2, 3.4, 0, 0, 7); c.fill();
  if (o.hood) {
    c.fillStyle = o.hood; c.beginPath(); c.ellipse(0, -1, 15, 16, 0, 0, 7); c.fill(); c.strokeStyle = INK; c.lineWidth = .8; c.stroke();
  } else curls(c, 0, -1, 12.4, Math.PI * 0.95, Math.PI * 2.05, 34, o.seed ?? 5);
  if (o.wrap) { // head-wrap seen from behind: a cloth cap over the crown, knot tail to one side, curls bursting below
    c.fillStyle = o.wrap; c.beginPath(); c.ellipse(0, -2, 15, 15, 0, Math.PI, 0); c.quadraticCurveTo(0, 3, -15, -2); c.closePath(); c.fill(); c.strokeStyle = INK; c.lineWidth = 0.8; c.stroke();
    if (o.wrapTail) { poly(c, [[9, -6], [15, -4], [19, 11], [13, 12]], o.wrap); }
    curls(c, 0, 1, 12.6, Math.PI * 0.02, Math.PI * 0.98, 12, (o.seed ?? 5) + 2, 0.9);

function garmentStyle(c, g) { c.fillStyle = g.col; }
function holes(c, pts, g, every = 7) {
  c.fillStyle = g.hole; for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], L = Math.hypot(b.x - a.x, b.y - a.y), n = Math.floor(L / every);
    for (let k = 1; k < n; k++) { const x = lerp(a.x, b.x, k / n), y = lerp(a.y, b.y, k / n); c.beginPath(); c.arc(x, y - 3, 0.9, 0, 7); c.fill(); }

// o: x,y,s,face,pose,t,bow,gar(key),len('long'|'knee'|'short'),hood,wrap,wrapTail,accent:{cuff,strap,trim,lining},aF,aB,hold(fn(c, handF, handB))
function man(c, o) {

  c.save(); c.translate(o.x, o.y); c.scale(o.s * (o.face ?? 1), o.s);
  if (o.shiver) c.translate(Math.sin(o.t * 70) * 0.6, 0);
  const P = pose(o);
  const S = add(P.N, J(0, 6));
  const u = (() => { const dx = P.N.x - P.H.x, dy = P.N.y - P.H.y, l = Math.hypot(dx, dy); return J(dx / l, dy / l); })();

  const [EB, HB] = limb(c, add(S, J(-2, 0)), P.aB[0], P.aB[1], 30, 28);
  stroke(c, [add(S, J(-2, 0)), EB, HB], 11, 'rgba(11,9,7,0.95)');

  const legW = o.len === 'short' ? 9 : 8.5;
  stroke(c, [P.H, P.K2, P.A2], legW, INK); stroke(c, [P.H, P.K1, P.A1], legW, INK);
  c.fillStyle = INK; [P.A1, P.A2].forEach(A => { c.beginPath(); c.ellipse(A.x + 4, A.y + 1.5, 7, 3, 0, 0, 7); c.fill(); });

    add(P.H, J(-p.x * 14, -p.y * 14)), add(P.N, J(-p.x * 14 * sh - u.x * 24, -p.y * 14 - u.y * 24)), add(P.N, J(-p.x * 11 - u.x * 2, -p.y * 11 - u.y * 2))];

  // inner backlight
  c.save(); c.clip(); const gl = c.createRadialGradient(P.H.x + 4, P.H.y - 20, 2, P.H.x, P.H.y - 10, 70); gl.addColorStop(0, 'rgba(255,236,190,0.35)'); gl.addColorStop(1, 'rgba(0,0,0,0.25)'); c.fillStyle = gl; c.fillRect(-80, -220, 160, 240); c.restore();
  holes(c, skirt.slice(2, 4).length === 2 ? [skirt[2], skirt[3]] : [skirt[1], skirt[2]], g, 6);
  if (o.fur) { c.fillStyle = 'rgba(230,205,160,0.95)'; const r = rng(11); for (let i = 0; i < 26; i++) { const q = lerpJ(T[0], T[1], i / 25); c.beginPath(); c.arc(q.x + 2, q.y, 2 + r() * 1.6, 0, 7); c.fill(); } }

  if (o.accent?.trim) { stroke(c, [T[1], T[2]], o.accent.trim, BURG); stroke(c, [skirt[1], skirt[2]], o.accent.trim, BURG); }
